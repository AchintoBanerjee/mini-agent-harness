<svg viewBox="0 0 1120 400" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:1120px;font-family:-apple-system,Segoe UI,Roboto,sans-serif;font-size:12px">
<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a1f2b"/></marker></defs>
<style>.b{fill:#fff;stroke:#1a1f2b;stroke-width:1.4;rx:8}.s{fill:#f1f0ec;stroke:#1a1f2b;stroke-width:1.2;rx:8}.o{fill:#eef1f5;stroke:#0f6cbd;stroke-width:1.6;rx:8}.wx{fill:#f8e3e4;stroke:#b0222b;stroke-width:1.6;rx:8}.h{fill:#1a1f2b;font-weight:600}.m{fill:#5b6472;font-size:10px}.y{fill:#6b7280;font-size:9.5px;font-weight:700;letter-spacing:.08em}.rx{fill:#b0222b;font-size:10px;font-weight:600}.bx{fill:#0f6cbd;font-size:10px;font-weight:600}.l{stroke:#1a1f2b;stroke-width:1.3;marker-end:url(#ah)}.p{fill:none;stroke:#1a1f2b;stroke-width:1.3;marker-end:url(#ah)}</style>
<rect width="1120" height="400" fill="#fff"/>
<text class="y" x="15" y="14">MEASURING THE HARNESS — TWO QUESTIONS, NEVER ONE SCORE · DID THE LOOP DO ITS JOB · WAS THE ANSWER RIGHT</text>
<text class="bx" x="15" y="42">BEFORE SHIP — a golden set, replayed on every change</text>
<rect class="o" x="60" y="50" width="200" height="84"/><text class="h" x="160" y="72" text-anchor="middle">Golden set</text><text class="m" x="160" y="88" text-anchor="middle">question · agent · expected tools</text><text class="m" x="160" y="102" text-anchor="middle">answer phrase · max passes</text><text class="m" x="160" y="116" text-anchor="middle">replayed before every change</text>
<rect class="o" x="60" y="160" width="200" height="56"/><text class="h" x="160" y="180" text-anchor="middle">Eval runner</text><text class="m" x="160" y="196" text-anchor="middle">a fresh loop per case</text>
<rect class="o" x="60" y="256" width="200" height="84"/><text class="h" x="160" y="278" text-anchor="middle">The table</text><text class="m" x="160" y="294" text-anchor="middle">harness: right tool · stopped by done</text><text class="m" x="160" y="308" text-anchor="middle">errors surfaced · passes · ms</text><text class="m" x="160" y="322" text-anchor="middle">agent: the answer</text>
<line class="l" x1="160" y1="134" x2="160" y2="158"/><line class="l" x1="160" y1="216" x2="160" y2="254"/>
<path class="p" d="M60,298 L38,298 L38,92 L58,92"/>
<rect class="s" x="400" y="50" width="200" height="56"/><text class="h" x="500" y="70" text-anchor="middle">Orchestrator</text><text class="m" x="500" y="86" text-anchor="middle">writes one span per step</text>
<path class="s" d="M400,170 a100,9 0 0 1 200,0 v44 a100,9 0 0 1 -200,0 z"/><path d="M400,170 a100,9 0 0 0 200,0" fill="none" stroke="#1a1f2b" stroke-width="1.2"/><text class="h" x="500" y="192" text-anchor="middle">Run store</text><text class="m" x="500" y="208" text-anchor="middle">conversation → turn → span</text>
<line class="l" x1="500" y1="106" x2="500" y2="163"/>
<path class="p" d="M400,190 L262,190"/><text class="m" x="268" y="206">the rows it scores</text>
<text class="bx" x="760" y="42">LIVE — a sample of real turns, scored on a schedule</text>
<rect class="o" x="760" y="50" width="200" height="56"/><text class="h" x="860" y="70" text-anchor="middle">Sample</text><text class="m" x="860" y="86" text-anchor="middle">a slice of live turns by turn id</text>
<rect class="o" x="760" y="160" width="200" height="56"/><text class="h" x="860" y="180" text-anchor="middle">Judge</text><text class="m" x="860" y="196" text-anchor="middle">another model · yes/no questions</text>
<rect class="o" x="760" y="256" width="200" height="70"/><text class="h" x="860" y="278" text-anchor="middle">Rates per agent version</text><text class="m" x="860" y="294" text-anchor="middle">right tool · cut short · errors · answer</text><text class="m" x="860" y="308" text-anchor="middle">against last version, last week</text>
<line class="l" x1="860" y1="106" x2="860" y2="158"/><line class="l" x1="860" y1="216" x2="860" y2="254"/>
<path class="p" d="M600,190 L670,190 L670,78 L758,78"/><text class="m" x="606" y="206">the same rows, live</text>
<path class="p" d="M960,290 L990,290 L990,78 L962,78"/><text class="m" x="996" y="190">every day</text>
<text class="m" x="15" y="368">The harness questions are facts in the rows and code scores them exactly; the answer needs a reference before ship and a judge once live. Never one blended score; a rate is good only against the last version.</text>
<text class="m" x="15" y="386">Blue = this section: the loop that runs in this repo on the left, the loop that needs a store, a judge and a schedule on the right · grey = the loop and its rows, unchanged.</text>
</svg>
