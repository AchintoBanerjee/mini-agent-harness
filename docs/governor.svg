<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#57606A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="960" height="420" fill="#FFFFFF"/>

  <!-- consumers (left) -->
  <rect x="24" y="117" width="150" height="44" rx="8" fill="#F6F8FA" stroke="#8C959F" stroke-width="1"/>
  <text x="38" y="144" font-size="15" font-weight="600" fill="#1F2328">Agent A</text>

  <rect x="24" y="189" width="150" height="44" rx="8" fill="#F6F8FA" stroke="#8C959F" stroke-width="1"/>
  <text x="38" y="216" font-size="15" font-weight="600" fill="#1F2328">Agent B</text>

  <rect x="24" y="261" width="150" height="44" rx="8" fill="#F6F8FA" stroke="#8C959F" stroke-width="1"/>
  <text x="38" y="288" font-size="15" font-weight="600" fill="#1F2328">Batch job</text>

  <!-- arrows consumers -> governor -->
  <line x1="174" y1="139" x2="270" y2="139" stroke="#57606A" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <line x1="174" y1="211" x2="270" y2="211" stroke="#57606A" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <line x1="174" y1="283" x2="270" y2="283" stroke="#57606A" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- governor (designed, not built: blue dashed) -->
  <rect x="270" y="48" width="400" height="280" rx="8" fill="#F6F8FA" stroke="#0969DA" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="284" y="70" font-size="15" font-weight="600" fill="#1F2328">Governor</text>
  <text x="284" y="89" font-size="12.5" font-weight="400" fill="#57606A">one shared step</text>

  <!-- lane A: share 40%, using 25% -->
  <text x="284" y="126" font-size="12.5" font-weight="400" fill="#57606A">A · share 40% · using 25%</text>
  <rect x="284" y="133" width="372" height="12" rx="2" fill="#FFFFFF" stroke="#8C959F" stroke-width="1"/>
  <rect x="284" y="133" width="93" height="12" rx="2" fill="#8C959F"/>
  <line x1="432.8" y1="129" x2="432.8" y2="149" stroke="#1F2328" stroke-width="1.5"/>

  <!-- lane B: share 40%, using 55% (light part = borrowed headroom) -->
  <text x="284" y="198" font-size="12.5" font-weight="400" fill="#57606A">B · share 40% · using 55%</text>
  <rect x="284" y="205" width="372" height="12" rx="2" fill="#FFFFFF" stroke="#8C959F" stroke-width="1"/>
  <rect x="284" y="205" width="148.8" height="12" rx="2" fill="#8C959F"/>
  <rect x="432.8" y="205" width="55.8" height="12" fill="#D0D7DE"/>
  <line x1="432.8" y1="201" x2="432.8" y2="221" stroke="#1F2328" stroke-width="1.5"/>

  <!-- lane batch: headroom only -->
  <text x="284" y="270" font-size="12.5" font-weight="400" fill="#57606A">batch · headroom only</text>
  <rect x="284" y="277" width="372" height="12" rx="2" fill="#FFFFFF" stroke="#8C959F" stroke-width="1"/>
  <rect x="581.6" y="277" width="74.4" height="12" rx="2" fill="#D0D7DE"/>

  <!-- lane key -->
  <text x="284" y="312" font-size="12.5" font-weight="400" fill="#57606A">tick = share · dark = own · light = headroom</text>

  <!-- arrow governor -> model -->
  <line x1="670" y1="188" x2="776" y2="188" stroke="#57606A" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- model (the shared model step: orange) -->
  <rect x="776" y="160" width="160" height="56" rx="8" fill="#FFF1E5" stroke="#BC4C00" stroke-width="1.5"/>
  <text x="790" y="182" font-size="15" font-weight="600" fill="#1F2328">Model</text>
  <text x="790" y="201" font-size="12.5" font-weight="400" fill="#57606A">GPU, rate limited</text>

  <!-- rule under the governor -->
  <text x="284" y="352" font-size="12.5" font-weight="400" fill="#57606A">never pause a run mid-flight: admit whole or wait</text>

  <!-- legend -->
  <rect x="24" y="385" width="14" height="10" rx="2" fill="#FFF1E5" stroke="#BC4C00" stroke-width="1.5"/>
  <text x="46" y="394" font-size="12.5" font-weight="400" fill="#57606A">orange = the shared model step</text>
  <rect x="236" y="385" width="14" height="10" rx="2" fill="none" stroke="#0969DA" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="258" y="394" font-size="12.5" font-weight="400" fill="#57606A">blue dashed = designed, not built</text>
</svg>
