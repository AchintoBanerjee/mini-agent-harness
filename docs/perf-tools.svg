<svg viewBox="0 0 1120 330" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:1120px;font-family:-apple-system,Segoe UI,Roboto,sans-serif;font-size:12px">
<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a1f2b"/></marker><marker id="ahb" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0f6cbd"/></marker></defs>
<style>.b{fill:#fff;stroke:#1a1f2b;stroke-width:1.4;rx:8}.s{fill:#f1f0ec;stroke:#1a1f2b;stroke-width:1.2;rx:8}.o{fill:#eef1f5;stroke:#0f6cbd;stroke-width:1.6;rx:8}.mt{fill:#fbe6d2;stroke:#a85713;stroke-width:1.6;rx:8}.wx{fill:#f8e3e4;stroke:#b0222b;stroke-width:1.6;rx:8}.h{fill:#1a1f2b;font-weight:600}.m{fill:#5b6472;font-size:10px}.y{fill:#6b7280;font-size:9.5px;font-weight:700;letter-spacing:.08em}.rx{fill:#b0222b;font-size:10px;font-weight:600}.bx{fill:#0f6cbd;font-size:10px;font-weight:600}.l{stroke:#1a1f2b;stroke-width:1.3;marker-end:url(#ah)}.p{fill:none;stroke:#1a1f2b;stroke-width:1.3;marker-end:url(#ah)}.d{stroke:#0f6cbd;stroke-width:1.3;stroke-dasharray:5 4;marker-end:url(#ahb);fill:none}</style>
<rect width="1120" height="330" fill="#fff"/>
<text class="y" x="15" y="14">TOOLS IN THE HUNDREDS — EVERY DEFINITION RIDES IN EVERY MODEL CALL UNLESS THE HARNESS CHOOSES</text>
<text class="rx" x="15" y="42">TODAY — load everything</text>
<rect class="s" x="15" y="50" width="200" height="70"/><text class="h" x="115" y="72" text-anchor="middle">Tool servers · native tools</text><text class="m" x="115" y="88" text-anchor="middle">MCP tools/list, live, every turn</text><text class="m" x="115" y="102" text-anchor="middle">300 definitions</text>
<rect class="wx" x="265" y="50" width="200" height="70"/><text class="h" x="365" y="72" text-anchor="middle">every model call</text><text class="m" x="365" y="88" text-anchor="middle">300 definitions · about 150k tokens</text><text class="m" x="365" y="102" text-anchor="middle">before the model reads the question</text>
<line class="l" x1="215" y1="85" x2="263" y2="85"/>
<text class="m" x="15" y="145">past a few dozen tools the model mis-picks among look-alikes; the tokens are paid on every call of every turn</text>
<text class="bx" x="600" y="42">THE DESIGN — a catalog, an index, one search tool</text>
<rect class="s" x="600" y="50" width="160" height="56"/><text class="h" x="680" y="70" text-anchor="middle">Tool servers</text><text class="m" x="680" y="86" text-anchor="middle">listed once, at registration</text>
<rect class="o" x="800" y="50" width="160" height="56"/><text class="h" x="880" y="70" text-anchor="middle">Catalog + index</text><text class="m" x="880" y="86" text-anchor="middle">every definition, searchable</text>
<rect class="o" x="600" y="140" width="200" height="70"/><text class="h" x="700" y="160" text-anchor="middle">each model call</text><text class="m" x="700" y="176" text-anchor="middle">3 to 5 pinned tools + search_tools</text><text class="m" x="700" y="190" text-anchor="middle">+ the definitions found so far</text>
<rect class="o" x="860" y="140" width="240" height="70"/><text class="h" x="980" y="160" text-anchor="middle">Orchestrator answers the search</text><text class="m" x="980" y="176" text-anchor="middle">from the index: names and one-liners</text><text class="m" x="980" y="190" text-anchor="middle">loads the found definition for the next pass</text>
<line class="l" x1="760" y1="78" x2="798" y2="78"/>
<path class="p" d="M800,175 L858,175"/><text class="m" x="805" y="168">search('refund')</text>
<path class="d" d="M980,210 L980,235 L700,235 L700,212"/><text class="m" x="720" y="248">the found definition joins the next call · remembered with the conversation</text>
<text class="m" x="15" y="290">The trade: one extra model call the first time a capability is needed, then a handful of definitions on every call instead of hundreds. Under about ten tools, just load them.</text>
<text class="m" x="15" y="306">Keep the found definition out of the cached prefix: append it as conversation content rather than rewriting the tools block, or the whole prefix is invalidated.</text>
<text class="m" x="15" y="322">Red = the cost paid today · blue = the design: the catalog outside the prompt, one search tool inside it.</text>
</svg>
