<svg viewBox="0 0 1120 250" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:1120px;font-family:-apple-system,Segoe UI,Roboto,sans-serif;font-size:12px">
<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a1f2b"/></marker><marker id="ahb" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0f6cbd"/></marker></defs>
<style>.b{fill:#fff;stroke:#1a1f2b;stroke-width:1.4;rx:8}.s{fill:#f1f0ec;stroke:#1a1f2b;stroke-width:1.2;rx:8}.o{fill:#eef1f5;stroke:#0f6cbd;stroke-width:1.6;rx:8}.mt{fill:#fbe6d2;stroke:#a85713;stroke-width:1.6;rx:8}.wx{fill:#f8e3e4;stroke:#b0222b;stroke-width:1.6;rx:8}.h{fill:#1a1f2b;font-weight:600}.m{fill:#5b6472;font-size:10px}.y{fill:#6b7280;font-size:9.5px;font-weight:700;letter-spacing:.08em}.rx{fill:#b0222b;font-size:10px;font-weight:600}.bx{fill:#0f6cbd;font-size:10px;font-weight:600}.l{stroke:#1a1f2b;stroke-width:1.3;marker-end:url(#ah)}.p{fill:none;stroke:#1a1f2b;stroke-width:1.3;marker-end:url(#ah)}.d{stroke:#0f6cbd;stroke-width:1.3;stroke-dasharray:5 4;marker-end:url(#ahb);fill:none}</style>
<rect width="1120" height="250" fill="#fff"/>
<text class="y" x="15" y="14">DEDUPE OF TOOL RESULTS — THE AGENT RE-CHECKS BECAUSE IT CANNOT TELL WHETHER THE DATA CHANGED</text>
<rect class="s" x="15" y="50" width="250" height="70"/><text class="h" x="140" y="72" text-anchor="middle">turn 1 · order_status(ORD-1)</text><text class="m" x="140" y="88" text-anchor="middle">the result, 5 KB, in the history</text><text class="m" x="140" y="102" text-anchor="middle">never touched again</text>
<rect class="o" x="315" y="50" width="250" height="70"/><text class="h" x="440" y="72" text-anchor="middle">turn 4 · order_status(ORD-1)</text><text class="m" x="440" y="88" text-anchor="middle">same tool, same input, already in the conversation</text><text class="m" x="440" y="102" text-anchor="middle">→ "unchanged, see turn 1" · a reference</text>
<rect class="o" x="615" y="50" width="250" height="70"/><text class="h" x="740" y="72" text-anchor="middle">turn 9 · order_status(ORD-1)</text><text class="m" x="740" y="88" text-anchor="middle">a reference again</text><text class="m" x="740" y="102" text-anchor="middle">the prompt stops growing</text>
<line class="l" x1="265" y1="85" x2="313" y2="85"/><line class="l" x1="565" y1="85" x2="613" y2="85"/>
<rect class="wx" x="915" y="50" width="190" height="70"/><text class="h" x="1010" y="72" text-anchor="middle">what we saw</text><text class="m" x="1010" y="88" text-anchor="middle">by turn 16, ten identical results</text><text class="m" x="1010" y="102" text-anchor="middle">re-injected: most of the prompt</text>
<text class="m" x="15" y="150">Why not block the repeat: wrong when the data does change. Why not drop the old copy: it rewrites the prefix and the cache misses. A reference is append-only, so ordering and dedupe compose.</text>
<text class="m" x="15" y="166">Only where the data is stable: a stability rule per tool. Time: a smaller prefill. Tokens: the duplicate is never paid for again.</text>
<text class="m" x="15" y="190">Grey = the original result · blue = the references · red = the bloat it replaces.</text>
</svg>
