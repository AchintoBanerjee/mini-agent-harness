<svg viewBox="0 0 1120 470" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:1120px;font-family:-apple-system,Segoe UI,Roboto,sans-serif;font-size:12px">
<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a1f2b"/></marker></defs>
<style>.b{fill:#fff;stroke:#1a1f2b;stroke-width:1.4;rx:8}.s{fill:#f1f0ec;stroke:#1a1f2b;stroke-width:1.2;rx:8}.o{fill:#eef1f5;stroke:#0f6cbd;stroke-width:1.6;rx:8}.mt{fill:#fbe6d2;stroke:#a85713;stroke-width:1.6;rx:8}.wx{fill:#f8e3e4;stroke:#b0222b;stroke-width:1.6;rx:8}.h{fill:#1a1f2b;font-weight:600}.m{fill:#5b6472;font-size:10px}.y{fill:#6b7280;font-size:9.5px;font-weight:700;letter-spacing:.08em}.wm{fill:#a85713;font-size:10px;font-weight:700}.rx{fill:#b0222b;font-size:10px;font-weight:600}.bx{fill:#0f6cbd;font-size:10px;font-weight:600}.l{stroke:#1a1f2b;stroke-width:1.3;marker-end:url(#ah)}.p{fill:none;stroke:#1a1f2b;stroke-width:1.3;marker-end:url(#ah)}</style>
<rect width="1120" height="470" fill="#fff"/>
<text class="y" x="15" y="14">SCALING THE GPU — IT DOES NOT AUTOSCALE · EVERY TENANT HAS A SHARE · WHAT OTHERS DO NOT USE IS THE ROOM</text>
<rect class="s" x="15" y="50" width="150" height="56"/><text class="h" x="90" y="70" text-anchor="middle">Tenant A workers</text><text class="m" x="90" y="86" text-anchor="middle">live turns · share 30%</text>
<rect class="s" x="15" y="125" width="150" height="56"/><text class="h" x="90" y="145" text-anchor="middle">Tenant B workers</text><text class="m" x="90" y="161" text-anchor="middle">live turns · share 30%</text>
<rect class="s" x="15" y="200" width="150" height="56"/><text class="h" x="90" y="220" text-anchor="middle">Tenant C workers</text><text class="m" x="90" y="236" text-anchor="middle">live turns · share 40%</text>
<rect class="s" x="15" y="275" width="150" height="56"/><text class="h" x="90" y="295" text-anchor="middle">Batch jobs</text><text class="m" x="90" y="311" text-anchor="middle">no user waiting</text>
<rect class="o" x="215" y="50" width="650" height="290"/><text class="h" x="540" y="72" text-anchor="middle">Governor — one shared service in front of the GPU</text>
<text class="m" x="235" y="96">the GPU, as the meter sees it right now:</text>
<rect x="235" y="104" width="186" height="26" fill="#fff" stroke="#1a1f2b" stroke-width="1.2"/><rect x="235" y="104" width="155" height="26" fill="#c9ccd1"/>
<rect x="421" y="104" width="186" height="26" fill="#fff" stroke="#1a1f2b" stroke-width="1.2"/><rect x="421" y="104" width="31" height="26" fill="#c9ccd1"/>
<rect x="607" y="104" width="248" height="26" fill="#fff" stroke="#1a1f2b" stroke-width="1.2"/><rect x="607" y="104" width="248" height="26" fill="#c9ccd1"/>
<text class="m" x="328" y="146" text-anchor="middle">A · share 30 · using 25</text><text class="m" x="514" y="146" text-anchor="middle">B · share 30 · using 5</text><text class="m" x="731" y="146" text-anchor="middle">C · share 40 · using 40</text>
<text class="bx" x="514" y="162" text-anchor="middle">B's unused 25 is the room · nobody set it aside, B is just not using it</text>
<rect class="b" x="235" y="180" width="300" height="56"/><text class="h" x="385" y="200" text-anchor="middle">gate 1 · within your share</text><text class="m" x="385" y="216" text-anchor="middle">always admitted</text>
<rect class="b" x="555" y="180" width="300" height="56"/><text class="h" x="705" y="200" text-anchor="middle">gate 2 · over your share</text><text class="m" x="705" y="216" text-anchor="middle">only while the room is substantial: under the threshold</text>
<text class="m" x="235" y="262">why the threshold: if B comes back for its own share, it must never queue behind C's burst · configurable, we run it conservative</text>
<text class="m" x="235" y="278">batch: a whole run admitted only into that room, then it runs to the end · never paused mid-run · past its deadline it runs under its own share</text>
<rect class="o" x="235" y="292" width="620" height="38"/><text class="h" x="545" y="308" text-anchor="middle">the meter: saturation per window = a·calls + b·input tokens + c·output tokens</text><text class="m" x="545" y="323" text-anchor="middle">weights from running the GPU to saturation, per GPU type and model family · output tokens carry most of the weight</text>
<rect class="mt" x="915" y="50" width="190" height="70"/><text class="h" x="1010" y="72" text-anchor="middle">LLM proxy → model on GPU</text><text class="m" x="1010" y="88" text-anchor="middle">a fixed number of cards</text><text class="wm" x="1010" y="104" text-anchor="middle">shared by every tenant</text>
<rect class="wx" x="915" y="150" width="190" height="84"/><text class="rx" x="1010" y="172" text-anchor="middle">the provider's gauge</text><text class="m" x="1010" y="188" text-anchor="middle">for reporting · minutes late</text><text class="m" x="1010" y="202" text-anchor="middle">rate limited · not a number</text><text class="m" x="1010" y="216" text-anchor="middle">you can gate a call on</text>
<line class="l" x1="165" y1="78" x2="213" y2="78"/><path class="p" d="M165,153 L190,153 L190,92 L213,92"/><path class="p" d="M165,228 L200,228 L200,106 L213,106"/><path class="p" d="M165,303 L208,303 L208,120 L213,120"/>
<line class="l" x1="865" y1="85" x2="913" y2="85"/>
<text class="m" x="15" y="372">The hard part is the number itself. The GPU's utilization is what the decision needs, and the provider's gauge is for reporting and arrives late, so the meter computes saturation from what every call shows,</text>
<text class="m" x="15" y="388">calls, input tokens and output tokens, weighted; the weights come from running the GPU to saturation and reading what it processed when the time started going up.</text>
<text class="m" x="15" y="412">Open the GPU to everyone and one busy tenant slows the model for all; keep every tenant inside its share and the unused shares are wasted. The two gates do both: protect the share, lend the room.</text>
<text class="m" x="15" y="440">Grey = the tenants and their shares, filled = in use · blue = the governor and the meter · orange = the shared GPU · red = the number you cannot decide on.</text>
</svg>
