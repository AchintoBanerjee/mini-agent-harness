<svg viewBox="0 0 1120 420" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:1120px;font-family:-apple-system,Segoe UI,Roboto,sans-serif;font-size:12px">
<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a1f2b"/></marker><marker id="ahb" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0f6cbd"/></marker></defs>
<style>.b{fill:#fff;stroke:#1a1f2b;stroke-width:1.4;rx:8}.s{fill:#f1f0ec;stroke:#1a1f2b;stroke-width:1.2;rx:8}.o{fill:#eef1f5;stroke:#0f6cbd;stroke-width:1.6;rx:8}.mt{fill:#fbe6d2;stroke:#a85713;stroke-width:1.6;rx:8}.wx{fill:#f8e3e4;stroke:#b0222b;stroke-width:1.6;rx:8}.h{fill:#1a1f2b;font-weight:600}.m{fill:#5b6472;font-size:10px}.y{fill:#6b7280;font-size:9.5px;font-weight:700;letter-spacing:.08em}.wm{fill:#a85713;font-size:10px;font-weight:700}.rx{fill:#b0222b;font-size:10px;font-weight:600}.l{stroke:#1a1f2b;stroke-width:1.3;marker-end:url(#ah)}.p{fill:none;stroke:#1a1f2b;stroke-width:1.3;marker-end:url(#ah)}.d{stroke:#0f6cbd;stroke-width:1.3;stroke-dasharray:5 4;marker-end:url(#ahb);fill:none}</style>
<rect width="1120" height="420" fill="#fff"/>
<text class="y" x="15" y="14">SCALING THE GPU — IT DOES NOT AUTOSCALE · USE ALL OF IT, NEVER LET IT FALL OVER</text>
<rect class="s" x="15" y="50" width="150" height="60"/><text class="h" x="90" y="72" text-anchor="middle">Workers — tenant A</text><text class="m" x="90" y="88" text-anchor="middle">live turns</text><text class="m" x="90" y="102" text-anchor="middle">every model call goes here →</text>
<rect class="s" x="15" y="125" width="150" height="60"/><text class="h" x="90" y="147" text-anchor="middle">Workers — tenant B</text><text class="m" x="90" y="163" text-anchor="middle">live turns</text>
<rect class="s" x="15" y="200" width="150" height="60"/><text class="h" x="90" y="222" text-anchor="middle">Batch jobs</text><text class="m" x="90" y="238" text-anchor="middle">many records, no user waiting</text>
<rect class="o" x="215" y="50" width="200" height="70"/><text class="h" x="315" y="72" text-anchor="middle">Inference gateway</text><text class="m" x="315" y="88" text-anchor="middle">one request shape</text><text class="m" x="315" y="102" text-anchor="middle">pinned model or a class · pick the endpoint</text>
<rect class="o" x="465" y="50" width="400" height="210"/><text class="h" x="665" y="72" text-anchor="middle">Governor — the capacity meter, one shared service</text>
<text class="m" x="665" y="92" text-anchor="middle">saturation per window, computed from what every call shows:</text>
<text class="h" x="665" y="112" text-anchor="middle">U = a · calls + b · input tokens + c · output tokens</text>
<text class="m" x="665" y="128" text-anchor="middle">weights calibrated on real saturated minutes, per GPU type and model family</text>
<rect class="b" x="480" y="145" width="185" height="50"/><text class="h" x="572" y="165" text-anchor="middle">gate 1 · the fair share</text><text class="m" x="572" y="181" text-anchor="middle">within your share: admitted</text>
<rect class="b" x="675" y="145" width="185" height="50"/><text class="h" x="767" y="165" text-anchor="middle">gate 2 · the room</text><text class="m" x="767" y="181" text-anchor="middle">over the share: only while U &lt; threshold</text>
<text class="m" x="665" y="218" text-anchor="middle">batch: whole runs, only into headroom, never paused mid-run</text>
<text class="m" x="665" y="234" text-anchor="middle">the threshold is configurable; we run it conservative</text>
<rect class="mt" x="915" y="50" width="190" height="70"/><text class="h" x="1010" y="72" text-anchor="middle">Model (GPU)</text><text class="m" x="1010" y="88" text-anchor="middle">a fixed number of GPUs</text><text class="wm" x="1010" y="104" text-anchor="middle">shared by every customer</text>
<rect class="wx" x="915" y="145" width="190" height="70"/><text class="rx" x="1010" y="167" text-anchor="middle">the provider's utilization gauge</text><text class="m" x="1010" y="183" text-anchor="middle">built for reporting · minutes late</text><text class="m" x="1010" y="197" text-anchor="middle">not for a decision made per call</text>
<line class="l" x1="165" y1="80" x2="213" y2="80"/><path class="p" d="M165,155 L190,155 L190,92 L213,92"/><path class="p" d="M165,230 L200,230 L200,104 L213,104"/>
<line class="l" x1="415" y1="85" x2="463" y2="85"/><line class="l" x1="865" y1="85" x2="913" y2="85"/>
<text class="m" x="15" y="300">The opener: with the GPU open to everyone, one busy tenant slows the model for all of them; a slow model is a slow platform. So every consumer gets a share, and the room above the share is used only while the meter says there is room.</text>
<text class="m" x="15" y="316">The catch: the room is GPU utilization, and the provider's number is for reporting and arrives late. So the meter computes saturation itself, per window, from the calls, the input tokens and the output tokens it sees.</text>
<text class="m" x="15" y="332">Grey = the callers · blue = the gateway and the governor, this section · orange = the shared GPU · red = the number you cannot decide on.</text>
</svg>
