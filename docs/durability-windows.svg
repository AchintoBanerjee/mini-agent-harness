<svg viewBox="0 0 1120 330" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:1120px;font-family:-apple-system,Segoe UI,Roboto,sans-serif;font-size:12px">
<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a1f2b"/></marker></defs>
<style>.b{fill:#fff;stroke:#1a1f2b;stroke-width:1.4;rx:8}.s{fill:#f1f0ec;stroke:#1a1f2b;stroke-width:1.2;rx:8}.o{fill:#eef1f5;stroke:#0f6cbd;stroke-width:1.6;rx:8}.wx{fill:#f8e3e4;stroke:#b0222b;stroke-width:1.6;rx:8}.h{fill:#1a1f2b;font-weight:600}.m{fill:#5b6472;font-size:10px}.y{fill:#6b7280;font-size:9.5px;font-weight:700;letter-spacing:.08em}.rx{fill:#b0222b;font-size:10px;font-weight:600}.l{stroke:#1a1f2b;stroke-width:1.3;marker-end:url(#ah)}.p{fill:none;stroke:#1a1f2b;stroke-width:1.3;marker-end:url(#ah)}</style>
<rect width="1120" height="330" fill="#fff"/>
<text class="y" x="15" y="14">THE GUARANTEE — ONE TURN, TWO PLACES A WORKER CAN DIE</text>
<rect class="s" x="15" y="50" width="170" height="60"/><text class="h" x="100" y="72" text-anchor="middle">1 · model decides</text><text class="m" x="100" y="88" text-anchor="middle">call order_status (ORD-1)</text><text class="m" x="100" y="102" text-anchor="middle">saved before the tool runs</text>
<rect class="o" x="235" y="50" width="170" height="60"/><text class="h" x="320" y="72" text-anchor="middle">the tool runs</text><text class="m" x="320" y="88" text-anchor="middle">the side effect happens here</text><text class="m" x="320" y="102" text-anchor="middle">key: job id + step 1</text>
<rect class="s" x="455" y="50" width="170" height="60"/><text class="h" x="540" y="72" text-anchor="middle">2 · tool result</text><text class="m" x="540" y="88" text-anchor="middle">saved</text><text class="m" x="540" y="102" text-anchor="middle">the lease is extended</text>
<rect class="s" x="675" y="50" width="170" height="60"/><text class="h" x="760" y="72" text-anchor="middle">3 · model says done</text><text class="m" x="760" y="88" text-anchor="middle">saved</text><text class="m" x="760" y="102" text-anchor="middle">the answer is relayed</text>
<rect class="b" x="895" y="50" width="210" height="60"/><text class="h" x="1000" y="72" text-anchor="middle">ack</text><text class="m" x="1000" y="88" text-anchor="middle">the message leaves the queue</text><text class="m" x="1000" y="102" text-anchor="middle">only now</text>
<line class="l" x1="185" y1="80" x2="233" y2="80"/><line class="l" x1="405" y1="80" x2="453" y2="80"/><line class="l" x1="625" y1="80" x2="673" y2="80"/><line class="l" x1="845" y1="80" x2="893" y2="80"/>
<path class="s" d="M15,200 a415,9 0 0 1 830,0 v44 a415,9 0 0 1 -830,0 z"/><path d="M15,200 a415,9 0 0 0 830,0" fill="none" stroke="#1a1f2b" stroke-width="1.2"/><text class="h" x="430" y="222" text-anchor="middle">Run store — the saved steps</text><text class="m" x="430" y="238" text-anchor="middle">step 1 · step 2 · step 3, each written before the next thing happens</text>
<line class="l" x1="100" y1="110" x2="100" y2="193"/><line class="l" x1="540" y1="110" x2="540" y2="193"/><line class="l" x1="760" y1="110" x2="760" y2="193"/>
<rect class="wx" x="425" y="130" width="24" height="24" rx="12"/><text class="rx" x="437" y="146" text-anchor="middle">B</text>
<rect class="wx" x="645" y="130" width="24" height="24" rx="12"/><text class="rx" x="657" y="146" text-anchor="middle">A</text>
<text class="rx" x="15" y="280">A · the worker dies after a step is saved</text><text class="m" x="15" y="296">the lease runs out, the next worker loads steps 1 and 2 and continues at 3 · nothing runs twice · the model is not asked again</text>
<text class="rx" x="575" y="280">B · the worker dies after the tool ran, before its result was saved</text><text class="m" x="575" y="296">the next worker sees step 1 with no result and runs the tool again · at least once · the key makes a writing tool a no-op</text>
<text class="m" x="15" y="320">Saved steps run once · the model decision is recorded, never re-asked · the one call in flight may run twice, so tools are idempotent on the key · ack only after the last step is saved.</text>
</svg>
