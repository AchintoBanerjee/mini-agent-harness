<svg xmlns="http://www.w3.org/2000/svg" width="960" viewBox="0 0 960 400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#57606A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="960" height="400" fill="#FFFFFF"/>

<!-- left: the two faces -->
<rect x="72" y="48" width="220" height="56" rx="8" fill="#F6F8FA" stroke="#1A7F37" stroke-width="1.5"/>
<path d="M266 62 l4 4 l8 -9" fill="none" stroke="#1A7F37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="86" y="70" font-size="15" font-weight="600" fill="#1F2328">CLI</text>
<text x="86" y="89" font-size="12.5" font-weight="400" fill="#57606A">run · resume · replay · eval</text>

<rect x="72" y="152" width="220" height="56" rx="8" fill="#F6F8FA" stroke="#1A7F37" stroke-width="1.5"/>
<path d="M266 166 l4 4 l8 -9" fill="none" stroke="#1A7F37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="86" y="174" font-size="15" font-weight="600" fill="#1F2328">HTTP API</text>
<text x="86" y="193" font-size="12.5" font-weight="400" fill="#57606A">job id at once, SSE out</text>

<!-- middle: the loop -->
<rect x="372" y="100" width="236" height="56" rx="8" fill="#F6F8FA" stroke="#1A7F37" stroke-width="1.5"/>
<path d="M582 114 l4 4 l8 -9" fill="none" stroke="#1A7F37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="386" y="122" font-size="15" font-weight="600" fill="#1F2328">Orchestrator</text>
<text x="386" y="141" font-size="12.5" font-weight="400" fill="#57606A">ask, run tools, repeat, Done</text>

<!-- right: the model stub and the tools -->
<rect x="690" y="48" width="246" height="56" rx="8" fill="#FFF1E5" stroke="#BC4C00" stroke-width="1.5"/>
<text x="704" y="70" font-size="15" font-weight="600" fill="#1F2328">Model stub</text>
<text x="704" y="89" font-size="12.5" font-weight="400" fill="#57606A">RuleBasedLLM: no network, no keys</text>

<rect x="690" y="152" width="246" height="56" rx="8" fill="#F6F8FA" stroke="#1A7F37" stroke-width="1.5"/>
<path d="M910 166 l4 4 l8 -9" fill="none" stroke="#1A7F37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="704" y="174" font-size="15" font-weight="600" fill="#1F2328">Tools</text>
<text x="704" y="193" font-size="12.5" font-weight="400" fill="#57606A">tools/*.json, allowlist, timeout</text>

<!-- bottom: the store -->
<rect x="24" y="288" width="912" height="56" rx="8" fill="#F6F8FA" stroke="#1A7F37" stroke-width="1.5"/>
<path d="M910 302 l4 4 l8 -9" fill="none" stroke="#1A7F37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="38" y="310" font-size="15" font-weight="600" fill="#1F2328">SQLite harness.db</text>
<text x="38" y="329" font-size="12.5" font-weight="400" fill="#57606A">job · step</text>

<!-- arrows -->
<g stroke="#57606A" stroke-width="1.5" fill="none">
<path d="M292 76 H324 V120 H370" marker-end="url(#arrow)"/>
<path d="M292 180 H340 V136 H370" marker-end="url(#arrow)"/>
<path d="M608 120 H648 V76 H688" marker-end="url(#arrow)"/>
<path d="M608 136 H664 V180 H688" marker-end="url(#arrow)"/>
<line x1="490" y1="156" x2="490" y2="286" marker-end="url(#arrow)"/>
<line x1="250" y1="208" x2="250" y2="286" marker-end="url(#arrow)"/>
<path d="M72 90 H48 V286" marker-end="url(#arrow)"/>
</g>
<text x="498" y="230" font-size="12.5" font-weight="400" fill="#57606A">write each step before acting on it</text>
<text x="258" y="262" font-size="12.5" font-weight="400" fill="#57606A">GET /runs, SSE: read the rows</text>
<text x="56" y="262" font-size="12.5" font-weight="400" fill="#57606A">replay, resume</text>

<!-- legend -->
<rect x="24" y="366" width="14" height="10" rx="2" fill="#F6F8FA" stroke="#1A7F37" stroke-width="1.5"/>
<text x="44" y="375" font-size="12.5" font-weight="400" fill="#57606A">green = built in v2</text>
<rect x="176" y="366" width="14" height="10" rx="2" fill="#FFF1E5" stroke="#BC4C00" stroke-width="1.5"/>
<text x="196" y="375" font-size="12.5" font-weight="400" fill="#57606A">orange = the shared model step</text>
</svg>
