<svg viewBox="0 0 1120 380" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:1120px;font-family:-apple-system,Segoe UI,Roboto,sans-serif;font-size:12px">
<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a1f2b"/></marker></defs>
<style>.b{fill:#fff;stroke:#1a1f2b;stroke-width:1.4;rx:8}.s{fill:#f1f0ec;stroke:#1a1f2b;stroke-width:1.2;rx:8}.o{fill:#eef1f5;stroke:#0f6cbd;stroke-width:1.6;rx:8}.wx{fill:#f8e3e4;stroke:#b0222b;stroke-width:1.6;rx:8}.h{fill:#1a1f2b;font-weight:600}.m{fill:#5b6472;font-size:10px}.y{fill:#6b7280;font-size:9.5px;font-weight:700;letter-spacing:.08em}.rx{fill:#b0222b;font-size:10px;font-weight:600}.bx{fill:#0f6cbd;font-size:10px;font-weight:600}.l{stroke:#1a1f2b;stroke-width:1.3;marker-end:url(#ah)}.p{fill:none;stroke:#1a1f2b;stroke-width:1.3;marker-end:url(#ah)}.l2{stroke:#1a1f2b;stroke-width:1.3;marker-end:url(#ah);marker-start:url(#ah)}</style>
<rect width="1120" height="380" fill="#fff"/>
<text class="y" x="15" y="14">THREE WAYS TO LET AGENTS WORK TOGETHER — WHO DECIDES THE NEXT STEP, WHO SEES WHAT, WHAT A HOP COSTS</text>
<text class="rx" x="15" y="42">1 · GROUP CHAT / SUPERVISOR — the one we did first</text>
<rect class="s" x="105" y="50" width="160" height="44"/><text class="h" x="185" y="68" text-anchor="middle">Supervisor</text><text class="m" x="185" y="84" text-anchor="middle">sees everything · picks every step</text>
<rect class="s" x="15" y="150" width="105" height="44"/><text class="h" x="67" y="168" text-anchor="middle">Agent A</text><text class="m" x="67" y="184" text-anchor="middle">orders</text>
<rect class="s" x="132" y="150" width="105" height="44"/><text class="h" x="184" y="168" text-anchor="middle">Agent B</text><text class="m" x="184" y="184" text-anchor="middle">shipments</text>
<rect class="s" x="249" y="150" width="105" height="44"/><text class="h" x="301" y="168" text-anchor="middle">Agent C</text><text class="m" x="301" y="184" text-anchor="middle">stock</text>
<path class="l2" d="M148,104 L75,146"/><path class="l2" d="M185,104 L184,146"/><path class="l2" d="M222,104 L293,146"/>
<rect class="wx" x="15" y="225" width="339" height="56"/><text class="h" x="184" y="247" text-anchor="middle">one shared transcript</text><text class="m" x="184" y="263" text-anchor="middle">every agent reads every other agent's calls and reasoning</text>
<line class="l" x1="67" y1="194" x2="67" y2="223"/><line class="l" x1="184" y1="194" x2="184" y2="223"/><line class="l" x1="301" y1="194" x2="301" y2="223"/>
<text class="m" x="15" y="305">every tool call goes to the supervisor and back:</text><text class="rx" x="15" y="320">about 2 model calls per hop · transcript grows with the square of the hops</text>
<text class="m" x="15" y="338">routing decided by a prompt, not testable · context leaks between agents</text>
<text class="bx" x="400" y="42">2 · AGENT AS A TOOL — sequence not known up front</text>
<rect class="o" x="400" y="50" width="200" height="56"/><text class="h" x="500" y="70" text-anchor="middle">Parent loop</text><text class="m" x="500" y="86" text-anchor="middle">its own tool choice is the router</text>
<rect class="o" x="400" y="150" width="140" height="56"/><text class="h" x="470" y="170" text-anchor="middle">Child · shipments</text><text class="m" x="470" y="186" text-anchor="middle">own loop, own tools</text>
<rect class="o" x="560" y="150" width="140" height="56"/><text class="h" x="630" y="170" text-anchor="middle">Child · stock</text><text class="m" x="630" y="186" text-anchor="middle">own loop, own tools</text>
<path class="p" d="M480,106 L470,148"/><text class="m" x="404" y="130">the goal</text>
<path class="p" d="M520,106 L630,148"/>
<path class="p" d="M500,206 L500,230 L560,230 L560,106"/><text class="m" x="566" y="226">the answer, only</text>
<text class="m" x="400" y="305">one model call per hop, on the child's side · no routing call:</text><text class="bx" x="400" y="320">linear · answers cross, transcripts never do</text>
<text class="m" x="400" y="338">bounded by depth and a shared budget · this is what v2 implements</text>
<text class="bx" x="760" y="42">3 · DAG — sequence known up front</text>
<rect class="s" x="760" y="50" width="100" height="44"/><text class="h" x="810" y="68" text-anchor="middle">classify</text><text class="m" x="810" y="84" text-anchor="middle">model node</text>
<rect class="s" x="890" y="50" width="100" height="44"/><text class="h" x="940" y="68" text-anchor="middle">look up</text><text class="m" x="940" y="84" text-anchor="middle">tool node</text>
<rect class="s" x="1000" y="50" width="100" height="44"/><text class="h" x="1050" y="68" text-anchor="middle">approve</text><text class="m" x="1050" y="84" text-anchor="middle">human node</text>
<rect class="s" x="890" y="150" width="100" height="44"/><text class="h" x="940" y="168" text-anchor="middle">answer</text><text class="m" x="940" y="184" text-anchor="middle">model node</text>
<line class="l" x1="860" y1="72" x2="888" y2="72"/><line class="l" x1="990" y1="72" x2="998" y2="72"/><path class="p" d="M1050,94 L1050,172 L992,172"/>
<text class="m" x="760" y="130">the edges hold the routing:</text>
<text class="m" x="760" y="305">zero tokens for the routing · each node sees its inputs only:</text><text class="bx" x="760" y="320">replayable, testable · the engine I would use is Temporal</text>
<text class="m" x="760" y="338">not implemented here · tool calls and child context stay in their node</text>
<text class="m" x="15" y="366">One question decides: do I know the sequence up front? Known → the DAG. Unknown → agent as a tool. Group chat is risky and never the default. Red = the pattern that leaks and doubles the calls · blue = the lighter patterns.</text>
</svg>
