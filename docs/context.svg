<svg xmlns="http://www.w3.org/2000/svg" width="960" height="392" viewBox="0 0 960 392" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#57606A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>

  <!-- white card -->
  <rect x="0" y="0" width="960" height="392" fill="#FFFFFF"/>

  <!-- Turn: the ledger (built in v2) -->
  <rect x="24" y="155" width="180" height="56" rx="8" fill="#F6F8FA" stroke="#1A7F37" stroke-width="1.5"/>
  <text x="38" y="177" font-size="15" font-weight="600" fill="#1F2328">Turn</text>
  <text x="38" y="196" font-size="12.5" font-weight="400" fill="#57606A">every row, the ledger</text>
  <path d="M178 169 l4 4 l8 -9" fill="none" stroke="#1A7F37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- arrow Turn -> Context -->
  <path d="M 204 183 H 368" fill="none" stroke="#57606A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="212" y="173" font-size="12.5" font-weight="400" fill="#57606A">a view, never the record</text>

  <!-- Context: container with four band boxes -->
  <rect x="370" y="36" width="280" height="294" rx="8" fill="#FFFFFF" stroke="#8C959F" stroke-width="1"/>
  <text x="384" y="58" font-size="15" font-weight="600" fill="#1F2328">Context</text>

  <rect x="382" y="70" width="256" height="56" rx="6" fill="#F6F8FA" stroke="#8C959F" stroke-width="1"/>
  <text x="396" y="92" font-size="15" font-weight="600" fill="#1F2328">Agent and its tools</text>
  <text x="396" y="111" font-size="12.5" font-weight="400" fill="#57606A">stable, cache friendly</text>

  <rect x="382" y="134" width="256" height="56" rx="6" fill="#F6F8FA" stroke="#8C959F" stroke-width="1"/>
  <text x="396" y="156" font-size="15" font-weight="600" fill="#1F2328">Earlier turns as Q → A</text>
  <text x="396" y="175" font-size="12.5" font-weight="400" fill="#57606A">append only</text>

  <rect x="382" y="198" width="256" height="56" rx="6" fill="#F6F8FA" stroke="#8C959F" stroke-width="1"/>
  <text x="396" y="220" font-size="15" font-weight="600" fill="#1F2328">This turn's rows</text>
  <text x="396" y="239" font-size="12.5" font-weight="400" fill="#57606A">the newest result in full</text>

  <rect x="382" y="262" width="256" height="56" rx="6" fill="#F6F8FA" stroke="#8C959F" stroke-width="1"/>
  <text x="396" y="284" font-size="15" font-weight="600" fill="#1F2328">The question</text>
  <text x="396" y="303" font-size="12.5" font-weight="400" fill="#57606A">last</text>

  <!-- size budget bracket (designed, not built) -->
  <path d="M 668 36 H 660 V 330 H 668" fill="none" stroke="#0969DA" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="684" y="41" font-size="12.5" font-weight="400" fill="#0969DA">size budget (designed)</text>

  <!-- Dedupe within the turn: step 2 ran, step 5 deduped -->
  <rect x="684" y="115" width="220" height="56" rx="8" fill="#F6F8FA" stroke="#8C959F" stroke-width="1"/>
  <text x="698" y="137" font-size="15" font-weight="600" fill="#1F2328">same tool, same input</text>
  <text x="698" y="156" font-size="12.5" font-weight="400" fill="#57606A">step 2: ran, result stored</text>

  <rect x="684" y="195" width="220" height="56" rx="8" fill="#F6F8FA" stroke="#1A7F37" stroke-width="1.5"/>
  <text x="698" y="217" font-size="15" font-weight="600" fill="#1F2328">same tool, same input</text>
  <text x="698" y="236" font-size="12.5" font-weight="400" fill="#57606A">step 5: DEDUPED → see step 2</text>
  <path d="M878 209 l4 4 l8 -9" fill="none" stroke="#1A7F37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- see step 2 arrow -->
  <path d="M 904 223 H 920 V 143 H 906" fill="none" stroke="#57606A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- legend -->
  <rect x="24" y="356" width="14" height="10" rx="2" fill="#F6F8FA" stroke="#1A7F37" stroke-width="1.5"/>
  <text x="44" y="365" font-size="12.5" font-weight="400" fill="#57606A">green = built in v2</text>
  <rect x="154" y="356" width="14" height="10" rx="2" fill="none" stroke="#0969DA" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="174" y="365" font-size="12.5" font-weight="400" fill="#57606A">blue dashed = designed, not built</text>
</svg>
