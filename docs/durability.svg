<svg viewBox="0 0 1120 400" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:1120px;font-family:-apple-system,Segoe UI,Roboto,sans-serif;font-size:12px">
<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a1f2b"/></marker><marker id="ahb" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0f6cbd"/></marker></defs>
<style>.b{fill:#fff;stroke:#1a1f2b;stroke-width:1.4;rx:8}.s{fill:#f1f0ec;stroke:#1a1f2b;stroke-width:1.2;rx:8}.o{fill:#eef1f5;stroke:#0f6cbd;stroke-width:1.6;rx:8}.mt{fill:#fbe6d2;stroke:#a85713;stroke-width:1.6;rx:8}.h{fill:#1a1f2b;font-weight:600}.m{fill:#5b6472;font-size:10px}.y{fill:#6b7280;font-size:9.5px;font-weight:700;letter-spacing:.08em}.wm{fill:#a85713;font-size:10px;font-weight:700}.l{stroke:#1a1f2b;stroke-width:1.3;marker-end:url(#ah)}.p{fill:none;stroke:#1a1f2b;stroke-width:1.3;marker-end:url(#ah)}.d{stroke:#0f6cbd;stroke-width:1.3;stroke-dasharray:5 4;marker-end:url(#ahb);fill:none}</style>
<rect width="1120" height="400" fill="#fff"/>
<text class="y" x="15" y="14">DURABILITY — A TURN IS A JOB ON A QUEUE · THE WORKER CAN DIE, THE TURN CANNOT</text>
<rect class="b" x="15" y="50" width="140" height="60"/><text class="h" x="85" y="72" text-anchor="middle">End users</text><text class="m" x="85" y="88" text-anchor="middle">asks a question</text><text class="m" x="85" y="102" text-anchor="middle">job id back · then the stream</text>
<rect class="o" x="170" y="50" width="170" height="100"/><text class="h" x="255" y="70" text-anchor="middle">API layer — thin</text><text class="m" x="255" y="86" text-anchor="middle">holds the client connection · SSE</text><text class="m" x="255" y="100" text-anchor="middle">writes the turn row · enqueues</text><text class="m" x="255" y="114" text-anchor="middle">returns the job id at once</text><text class="m" x="255" y="128" text-anchor="middle">stateless · any node</text>
<rect class="o" x="370" y="50" width="170" height="110"/><text class="h" font-size="11" x="455" y="70" text-anchor="middle">Run queue — SQS-style</text><text class="m" x="455" y="86" text-anchor="middle">visibility timeout = the lease</text><text class="m" x="455" y="100" text-anchor="middle">worker extends it while live</text><text class="m" x="455" y="114" text-anchor="middle">ack after the step is persisted</text><text class="m" x="455" y="128" text-anchor="middle">dead worker → visible again</text><text class="m" x="455" y="142" text-anchor="middle">→ another worker picks it up</text>
<rect class="o" x="370" y="175" width="170" height="40"/><text class="h" font-size="11" x="455" y="193" text-anchor="middle">DLQ</text><text class="m" x="455" y="207" text-anchor="middle">repeated failures land here</text>
<rect class="o" x="570" y="50" width="250" height="130"/><text class="h" x="695" y="70" text-anchor="middle">Orchestrator service — workers</text><text class="m" x="695" y="86" text-anchor="middle">the loop · claims a run · extends the lease</text><text class="m" x="695" y="100" text-anchor="middle">persists each step · then acks</text><text class="m" x="695" y="114" text-anchor="middle">a dead worker: no ack · the lease runs out</text><text class="m" x="695" y="128" text-anchor="middle">resume — the next worker rebuilds context</text><text class="m" x="695" y="142" text-anchor="middle">from the saved steps → the model continues</text><text class="m" x="695" y="156" text-anchor="middle">pushes each step and the answer to the run's stream</text>
<rect class="s" x="850" y="50" width="170" height="60"/><text class="h" font-size="11" x="935" y="70" text-anchor="middle">Tool layer · Inference gateway</text><text class="m" x="935" y="86" text-anchor="middle">unchanged · as the user</text>
<rect class="mt" x="850" y="135" width="170" height="60"/><text class="h" x="935" y="155" text-anchor="middle">Model (GPU)</text><text class="m" x="935" y="171" text-anchor="middle">hosted models · premium remote</text><text class="wm" x="935" y="186" text-anchor="middle">shared by every customer</text>
<path class="s" d="M570,235 a125,9 0 0 1 250,0 v52 a125,9 0 0 1 -250,0 z"/><path d="M570,235 a125,9 0 0 0 250,0" fill="none" stroke="#1a1f2b" stroke-width="1.2"/><text class="h" font-size="11" x="695" y="258" text-anchor="middle">Run store — SQLite here · tenant DB at scale</text><text class="m" x="695" y="274" text-anchor="middle">conversation → turn (job id) → span rows</text><text class="m" x="695" y="288" text-anchor="middle">queue: visible at · receives</text>
<line class="l" x1="155" y1="80" x2="168" y2="80"/><line class="l" x1="340" y1="80" x2="368" y2="80"/><line class="l" x1="540" y1="80" x2="568" y2="80"/><line class="l" x1="820" y1="80" x2="848" y2="80"/>
<line class="l" x1="455" y1="160" x2="455" y2="173"/><line class="l" x1="935" y1="110" x2="935" y2="133"/>
<line class="l" x1="695" y1="180" x2="695" y2="226"/><text class="m" x="702" y="208">persist each step · before the next</text>
<path class="p" d="M255,150 L255,262 L562,262"/><text class="m" x="262" y="250">the turn row</text>
<path class="d" d="M695,50 L695,36 L255,36 L255,48"/><text class="m" x="475" y="31" text-anchor="middle">the run's stream, by job id: steps and answer tokens → the API layer → SSE to the client · the store only if the stream is gone</text>
<text class="m" x="15" y="328">Durability: a run is a message · the visibility timeout is the lease · the worker extends it while live and acks only after the step is persisted.</text>
<text class="m" x="15" y="344">A dead worker's message becomes visible again and another worker picks it up · repeated failures → DLQ · the scaling lever is queue depth, not request count.</text>
<text class="m" x="15" y="360">Contract: saved steps run once · the one in-flight call at least once → tool writes idempotent by key (job id + step) · fix if needed: started-marker before the call + verify on resume.</text>
<text class="m" x="15" y="384">Grey = unchanged · blue = this section · orange = shared by every customer · dashed = the run's stream back to the client; in production a Redis Stream per job id, so any API node can read it.</text>
</svg>
