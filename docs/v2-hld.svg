<svg viewBox="0 0 1120 350" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:1120px;font-family:-apple-system,Segoe UI,Roboto,sans-serif;font-size:12px">
<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a1f2b"/></marker><marker id="ahb" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0f6cbd"/></marker></defs>
<style>.b{fill:#fff;stroke:#1a1f2b;stroke-width:1.4;rx:8}.s{fill:#f1f0ec;stroke:#1a1f2b;stroke-width:1.2;rx:8}.o{fill:#eef1f5;stroke:#0f6cbd;stroke-width:1.6;rx:8}.mt{fill:#fbe6d2;stroke:#a85713;stroke-width:1.6;rx:8}.h{fill:#1a1f2b;font-weight:600}.m{fill:#5b6472;font-size:10px}.y{fill:#6b7280;font-size:9.5px;font-weight:700;letter-spacing:.08em}.wm{fill:#a85713;font-size:10px;font-weight:700}.l{stroke:#1a1f2b;stroke-width:1.3;marker-end:url(#ah)}.p{fill:none;stroke:#1a1f2b;stroke-width:1.3;marker-end:url(#ah)}.d{stroke:#0f6cbd;stroke-width:1.3;stroke-dasharray:5 4;marker-end:url(#ahb);fill:none}</style>
<rect width="1120" height="350" fill="#fff"/>
<text class="y" x="15" y="14">V2 HLD — THE HARNESS AS A SMALL SERVICE · A TURN IS A JOB · THE ANSWER STREAMS BACK</text>
<rect class="b" x="15" y="50" width="140" height="60"/><text class="h" x="85" y="72" text-anchor="middle">End users</text><text class="m" x="85" y="88" text-anchor="middle">asks a question</text><text class="m" x="85" y="102" text-anchor="middle">job id back · then the stream</text>
<rect class="o" x="170" y="50" width="170" height="100"/><text class="h" x="255" y="70" text-anchor="middle">API layer — HTTP</text><text class="m" x="255" y="86" text-anchor="middle">POST /runs → job id at once</text><text class="m" x="255" y="100" text-anchor="middle">GET /runs/{id} · steps, answer</text><text class="m" x="255" y="114" text-anchor="middle">GET /runs/{id}/events · SSE</text><text class="m" x="255" y="128" text-anchor="middle">agents and tools: metadata files</text>
<rect class="o" x="370" y="50" width="450" height="130"/><text class="h" x="595" y="70" text-anchor="middle">Orchestrator — the loop</text><text class="m" x="595" y="86" text-anchor="middle">build the context → call the model → run the tool it asks for → repeat</text><text class="m" x="595" y="100" text-anchor="middle">stops when the model says done · or at the agent's max passes</text><text class="m" x="595" y="114" text-anchor="middle">every step written to the store before the next one is taken</text><text class="m" x="595" y="128" text-anchor="middle">a clock on every tool call · two tools in one reply run together</text><text class="m" x="595" y="142" text-anchor="middle">a repeated call inside a conversation is not run again</text><text class="m" x="595" y="156" text-anchor="middle">the model is a stub today · a real model goes behind the same interface</text>
<rect class="s" x="850" y="50" width="170" height="60"/><text class="h" x="935" y="70" text-anchor="middle">Tool layer</text><text class="m" x="935" y="86" text-anchor="middle">registry from tools/*.json</text><text class="m" x="935" y="100" text-anchor="middle">type picks the adapter</text>
<rect class="mt" x="850" y="135" width="170" height="60"/><text class="h" x="935" y="155" text-anchor="middle">Model (GPU)</text><text class="m" x="935" y="171" text-anchor="middle">a rule stub today</text><text class="wm" x="935" y="186" text-anchor="middle">shared by every customer</text>
<path class="s" d="M470,235 a125,9 0 0 1 250,0 v52 a125,9 0 0 1 -250,0 z"/><path d="M470,235 a125,9 0 0 0 250,0" fill="none" stroke="#1a1f2b" stroke-width="1.2"/><text class="h" x="595" y="258" text-anchor="middle">Run store — SQLite</text><text class="m" x="595" y="274" text-anchor="middle">conversation → turn (job id) → span rows</text><text class="m" x="595" y="288" text-anchor="middle">one tenant database at scale, same tables</text>
<line class="l" x1="155" y1="80" x2="168" y2="80"/><line class="l" x1="340" y1="80" x2="368" y2="80"/><line class="l" x1="820" y1="80" x2="848" y2="80"/>
<path class="p" d="M820,120 L835,120 L835,165 L848,165"/>
<line class="l" x1="595" y1="180" x2="595" y2="226"/><text class="m" x="602" y="208">each step · before the next</text>
<path class="p" d="M300,150 L300,262 L462,262"/><text class="m" x="306" y="250">the turn row</text>
<path class="d" d="M595,50 L595,36 L255,36 L255,48"/><text class="m" x="425" y="31" text-anchor="middle">events by job id → SSE to the client</text>
<text class="m" x="15" y="322">With the stub a turn answers in milliseconds; in production it is seconds of model and tool calls. So a turn is a job: the id comes back at once, the answer streams as the steps happen, a dropped client reconnects with the last span it saw.</text>
<text class="m" x="15" y="338">Grey = the ordinary parts · blue = the HTTP face and the loop, this document's subject · orange = the model, shared by every customer · dashed = events back to the client.</text>
</svg>
