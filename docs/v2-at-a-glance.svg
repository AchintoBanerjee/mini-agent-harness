<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 536" width="960" height="536" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#57606A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="536" fill="#FFFFFF"/>

  <!-- Row 0: new in v2 (no v1 box lived here) -->
  <rect x="24" y="24" width="204" height="56" rx="8" fill="#F6F8FA" stroke="#8C959F" stroke-width="1"/>
  <text x="38" y="46" font-size="15" font-weight="600" fill="#1F2328">CLI</text>
  <text x="38" y="65" font-size="12.5" font-weight="400" fill="#57606A">run · resume · replay · eval</text>

  <rect x="260" y="24" width="204" height="56" rx="8" fill="#F6F8FA" stroke="#0969DA" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="274" y="46" font-size="15" font-weight="600" fill="#1F2328">Run queue + lease</text>
  <text x="274" y="65" font-size="12.5" font-weight="400" fill="#57606A">workers claim with a lease</text>

  <rect x="496" y="24" width="204" height="56" rx="8" fill="#F6F8FA" stroke="#0969DA" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="510" y="46" font-size="15" font-weight="600" fill="#1F2328">Context budget</text>
  <text x="510" y="65" font-size="12.5" font-weight="400" fill="#57606A">fold old rows at a byte cap</text>

  <rect x="732" y="24" width="204" height="56" rx="8" fill="#F6F8FA" stroke="#0969DA" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="746" y="46" font-size="15" font-weight="600" fill="#1F2328">Router + governor</text>
  <text x="746" y="65" font-size="12.5" font-weight="400" fill="#57606A">model, provider, admission</text>

  <!-- Row 1: the v1 top row -->
  <rect x="24" y="124" width="240" height="56" rx="8" fill="#F6F8FA" stroke="#1A7F37" stroke-width="1.5"/>
  <text x="38" y="146" font-size="15" font-weight="600" fill="#1F2328">Agent + tool files</text>
  <text x="38" y="165" font-size="12.5" font-weight="400" fill="#57606A">agents/*.json · tools/*.json</text>
  <path d="M238 138 l4 4 l8 -9" fill="none" stroke="#1A7F37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="360" y="124" width="240" height="56" rx="8" fill="#F6F8FA" stroke="#1A7F37" stroke-width="1.5"/>
  <text x="374" y="146" font-size="15" font-weight="600" fill="#1F2328">Orchestrator</text>
  <text x="374" y="165" font-size="12.5" font-weight="400" fill="#57606A">resume · dedupe · live trace</text>
  <path d="M574 138 l4 4 l8 -9" fill="none" stroke="#1A7F37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="696" y="124" width="240" height="56" rx="8" fill="#F6F8FA" stroke="#1A7F37" stroke-width="1.5"/>
  <text x="710" y="146" font-size="15" font-weight="600" fill="#1F2328">LLMProxy</text>
  <text x="710" y="165" font-size="12.5" font-weight="400" fill="#57606A">rule based, batch of matches</text>
  <path d="M910 138 l4 4 l8 -9" fill="none" stroke="#1A7F37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Row 2: the v1 middle row -->
  <rect x="24" y="224" width="240" height="56" rx="8" fill="#F6F8FA" stroke="#1A7F37" stroke-width="1.5"/>
  <text x="38" y="246" font-size="15" font-weight="600" fill="#1F2328">Run store</text>
  <text x="38" y="265" font-size="12.5" font-weight="400" fill="#57606A">jsonl per run, write first</text>
  <path d="M238 238 l4 4 l8 -9" fill="none" stroke="#1A7F37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="360" y="224" width="240" height="56" rx="8" fill="#F6F8FA" stroke="#1A7F37" stroke-width="1.5"/>
  <text x="374" y="246" font-size="15" font-weight="600" fill="#1F2328">ToolCaller</text>
  <text x="374" y="265" font-size="12.5" font-weight="400" fill="#57606A">own thread, clock, allowlist</text>
  <path d="M574 238 l4 4 l8 -9" fill="none" stroke="#1A7F37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="696" y="224" width="240" height="56" rx="8" fill="#F6F8FA" stroke="#8C959F" stroke-width="1"/>
  <text x="710" y="246" font-size="15" font-weight="600" fill="#1F2328">Tool registry</text>
  <text x="710" y="265" font-size="12.5" font-weight="400" fill="#57606A">name → tool</text>

  <!-- Row 3: the v1 bottom row plus v2 neighbours -->
  <rect x="24" y="324" width="240" height="56" rx="8" fill="#F6F8FA" stroke="#1A7F37" stroke-width="1.5"/>
  <text x="38" y="346" font-size="15" font-weight="600" fill="#1F2328">Eval runner</text>
  <text x="38" y="365" font-size="12.5" font-weight="400" fill="#57606A">golden set → table</text>
  <path d="M238 338 l4 4 l8 -9" fill="none" stroke="#1A7F37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="360" y="324" width="240" height="56" rx="8" fill="#F6F8FA" stroke="#1A7F37" stroke-width="1.5"/>
  <text x="374" y="346" font-size="15" font-weight="600" fill="#1F2328">Summarizer</text>
  <text x="374" y="365" font-size="12.5" font-weight="400" fill="#57606A">names a non-OK result</text>
  <path d="M574 338 l4 4 l8 -9" fill="none" stroke="#1A7F37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="696" y="324" width="240" height="56" rx="8" fill="#F6F8FA" stroke="#0969DA" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="710" y="346" font-size="15" font-weight="600" fill="#1F2328">Sub-agent as a tool</text>
  <text x="710" y="365" font-size="12.5" font-weight="400" fill="#57606A">child runs its own loop</text>

  <!-- Row 4 -->
  <rect x="24" y="424" width="240" height="56" rx="8" fill="#F6F8FA" stroke="#0969DA" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="38" y="446" font-size="15" font-weight="600" fill="#1F2328">Live judge</text>
  <text x="38" y="465" font-size="12.5" font-weight="400" fill="#57606A">sampled live runs, scored</text>

  <!-- Arrows -->
  <g stroke="#57606A" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <!-- CLI → Run queue → Orchestrator -->
    <path d="M228,52 H260"/>
    <path d="M412,80 V124"/>
    <!-- Context budget → Orchestrator -->
    <path d="M548,80 V124"/>
    <!-- LLMProxy → Router + governor (behind the proxy) -->
    <path d="M834,124 V80"/>
    <!-- Agent + tool files → Orchestrator -->
    <path d="M264,152 H360"/>
    <!-- Orchestrator → LLMProxy -->
    <path d="M600,152 H696"/>
    <!-- Orchestrator → ToolCaller → Tool registry -->
    <path d="M480,180 V224"/>
    <path d="M600,252 H696"/>
    <!-- Orchestrator → Run store (same L as v1) -->
    <path d="M396,180 V202 H144 V224"/>
    <!-- ToolCaller → Summarizer -->
    <path d="M480,280 V324"/>
    <!-- Run store → Eval runner → Live judge -->
    <path d="M144,280 V324"/>
    <path d="M144,380 V424"/>
    <!-- Sub-agent as a tool → Tool registry -->
    <path d="M816,324 V280"/>
  </g>

  <!-- Legend -->
  <rect x="24" y="500" width="14" height="10" rx="2" fill="#F6F8FA" stroke="#1A7F37" stroke-width="1.5"/>
  <text x="44" y="509" font-size="12.5" font-weight="400" fill="#57606A">green = built in v2</text>
  <rect x="154" y="500" width="14" height="10" rx="2" fill="none" stroke="#0969DA" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="174" y="509" font-size="12.5" font-weight="400" fill="#57606A">blue dashed = designed, not built</text>
</svg>
