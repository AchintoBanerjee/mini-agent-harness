<svg viewBox="0 0 1120 448" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:1120px;font-family:-apple-system,Segoe UI,Roboto,sans-serif;font-size:12px">
<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a1f2b"/></marker><marker id="ahb" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0f6cbd"/></marker></defs>
<style>.b{fill:#fff;stroke:#1a1f2b;stroke-width:1.4;rx:8}.s{fill:#f1f0ec;stroke:#1a1f2b;stroke-width:1.2;rx:8}.o{fill:#eef1f5;stroke:#0f6cbd;stroke-width:1.6;rx:8}.mt{fill:#fbe6d2;stroke:#a85713;stroke-width:1.6;rx:8}.wx{fill:#f8e3e4;stroke:#b0222b;stroke-width:1.6;rx:8}.h{fill:#1a1f2b;font-weight:600}.m{fill:#5b6472;font-size:10px}.y{fill:#6b7280;font-size:9.5px;font-weight:700;letter-spacing:.08em}.wm{fill:#a85713;font-size:10px;font-weight:700}.rx{fill:#b0222b;font-size:10px;font-weight:600}.bx{fill:#0f6cbd;font-size:10px;font-weight:600}.l{stroke:#1a1f2b;stroke-width:1.3;marker-end:url(#ah)}.p{fill:none;stroke:#1a1f2b;stroke-width:1.3;marker-end:url(#ah)}.d{stroke:#0f6cbd;stroke-width:1.3;stroke-dasharray:5 4;marker-end:url(#ahb);fill:none}.pk{fill:none;stroke:#0f6cbd;stroke-width:2.2;marker-end:url(#ahb)}</style>
<rect width="1120" height="448" fill="#fff"/>
<text class="y" x="15" y="14">ROUTING ACROSS PROVIDERS — THE AGENT DECLARES ITS MODELS · THE ONE MULTI-TENANT SERVICE PICKS WHERE TO RUN THEM</text>

<rect class="s" x="15" y="34" width="215" height="334"/><text class="h" x="22" y="52">Single-tenant service</text><text class="m" x="22" y="66">one per tenant · this one in region 1</text>
<rect class="b" x="24" y="76" width="196" height="54"/><text class="h" x="122" y="96" text-anchor="middle">The loop</text><text class="m" x="122" y="112" text-anchor="middle">runs here · asks the proxy</text><text class="m" x="122" y="124" text-anchor="middle">distance is measured from here</text>
<rect class="b" x="24" y="140" width="196" height="96"/><text class="h" x="122" y="160" text-anchor="middle">Agent file</text><text class="m" x="122" y="178" text-anchor="middle">declared: model A, model B</text><text class="m" x="122" y="192" text-anchor="middle">its golden set passed on both</text><text class="m" x="122" y="212" text-anchor="middle">models C and D also exist on the</text><text class="m" x="122" y="224" text-anchor="middle">platform; never candidates for this agent</text>
<rect class="b" x="24" y="246" width="196" height="56"/><text class="h" x="122" y="268" text-anchor="middle">Tenant policy</text><text class="m" x="122" y="286" text-anchor="middle">regions 1 and 2 allowed · 3 not</text>
<line class="l" x1="230" y1="103" x2="243" y2="103"/><line class="l" x1="230" y1="188" x2="243" y2="188"/><line class="l" x1="230" y1="274" x2="243" y2="274"/>

<rect class="o" x="245" y="34" width="330" height="334"/><text class="h" x="260" y="56">Inference wrapper — one multi-tenant service</text><text class="m" x="260" y="72">the LLM proxy in production · in front of the GPUs</text><text class="m" x="260" y="85">every tenant's calls go through it · the governor lives here</text>
<rect class="b" x="260" y="98" width="300" height="52"/><text class="h" x="272" y="116">① candidates</text><text class="m" x="272" y="132">the declared models, in the regions the tenant allows</text><text class="m" x="272" y="144">here: A and B, in regions 1 and 2</text>
<rect class="b" x="260" y="158" width="300" height="52"/><text class="h" x="272" y="176">② affinity</text><text class="m" x="272" y="192">a live conversation keeps its model and replica (the prefix cache)</text><text class="m" x="272" y="204">moves only if that replica is over the threshold or down</text>
<rect class="b" x="260" y="218" width="300" height="76"/><text class="h" x="272" y="236">③ the walk</text><text class="m" x="272" y="252">regions in order of distance from the service: 1, then 2</text><text class="m" x="272" y="264">at each region, the first declared model whose meter</text><text class="m" x="272" y="276">is under the threshold · stop at the first hit</text><text class="m" x="272" y="288">no hit anywhere: the lowest meter</text>
<rect class="b" x="260" y="302" width="300" height="52"/><text class="h" x="272" y="320">④ fallback</text><text class="m" x="272" y="336">throttled or down: continue the same walk</text><text class="m" x="272" y="348">never a model the agent did not declare</text>
<line class="l" x1="410" y1="150" x2="410" y2="156"/><line class="l" x1="410" y1="210" x2="410" y2="216"/><line class="l" x1="410" y1="294" x2="410" y2="300"/>

<text class="bx" x="620" y="52">REGION 1 · GPUs shared by every tenant · nearest</text>
<rect class="mt" x="620" y="60" width="220" height="48"/><text class="h" x="730" y="79" text-anchor="middle">model A · meter 92</text><text class="wm" x="730" y="96" text-anchor="middle">over the threshold: no room</text>
<rect class="mt" x="620" y="116" width="220" height="48"/><text class="h" x="730" y="135" text-anchor="middle">model B · meter 41</text><text class="m" x="730" y="152" text-anchor="middle">under: room · declared · picked</text>
<rect class="s" x="620" y="172" width="220" height="48"/><text class="h" x="730" y="191" text-anchor="middle">model C · meter 20</text><text class="m" x="730" y="208" text-anchor="middle">idle, but not declared: never a candidate</text>
<text class="bx" x="620" y="246">REGION 2 · next nearest</text>
<rect class="mt" x="620" y="254" width="220" height="48"/><text class="h" x="730" y="273" text-anchor="middle">model A · meter 35</text><text class="m" x="730" y="290" text-anchor="middle">next in the walk if B in 1 fails</text>
<rect class="mt" x="620" y="310" width="220" height="48"/><text class="h" x="730" y="329" text-anchor="middle">model B · meter 60</text><text class="m" x="730" y="346" text-anchor="middle">after that</text>
<text class="rx" x="880" y="52">REGION 3 · not allowed</text>
<rect class="wx" x="880" y="60" width="220" height="48"/><text class="h" x="990" y="79" text-anchor="middle">model A · meter 12</text><text class="rx" x="990" y="96" text-anchor="middle">idle, and never a candidate</text>
<rect class="s" x="880" y="246" width="220" height="118"/><text class="h" x="990" y="266" text-anchor="middle">The meter and the threshold</text><text class="m" x="990" y="284" text-anchor="middle">meter = the GPU's saturation, 0 to 100,</text><text class="m" x="990" y="297" text-anchor="middle">from calls and tokens per window (scaling page)</text><text class="m" x="990" y="315" text-anchor="middle">threshold = the limit the governor admits under,</text><text class="m" x="990" y="328" text-anchor="middle">configurable, run conservative</text><text class="m" x="990" y="346" text-anchor="middle">under the threshold = there is room for this call</text>
<path class="pk" d="M560,259 L590,259 L590,140 L618,140"/>
<path class="d" d="M560,328 L600,328 L600,278 L618,278"/>

<text class="m" x="15" y="402">Two things decide, and they do different jobs: distance sets the order in which regions are tried, the threshold decides whether a model in that region can be used at all. The router never ranks the models.</text>
<text class="m" x="15" y="418">The example: A and B declared; region 1 first, where A has no room and B has, so B in region 1 is the pick; C sits idle there and is skipped, it was never tested; A in region 2 is next.</text>
<text class="m" x="15" y="434">Beige = single-tenant, one per tenant · blue = the one multi-tenant service · orange = GPUs shared by every tenant · grey = a model this agent never declared.</text>
</svg>
