<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#57606A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="420" fill="#FFFFFF"/>

  <!-- events line: Workers back to the API node -->
  <path d="M806 72 V42 H292 V72" fill="none" stroke="#57606A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="304" y="35" font-size="12.5" font-weight="400" fill="#57606A">events by run id</text>

  <!-- row 1: the strip, y 72..128 -->
  <rect x="24" y="72" width="124" height="56" rx="8" fill="#F6F8FA" stroke="#8C959F" stroke-width="1"/>
  <text x="38" y="94" font-size="15" font-weight="600" fill="#1F2328">Clients</text>
  <text x="38" y="113" font-size="12.5" font-weight="400" fill="#57606A">many, concurrent</text>
  <line x1="148" y1="100" x2="184" y2="100" stroke="#57606A" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <rect x="184" y="72" width="216" height="56" rx="8" fill="#F6F8FA" stroke="#0969DA" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="198" y="94" font-size="15" font-weight="600" fill="#1F2328">API node</text>
  <text x="198" y="113" font-size="12.5" font-weight="400" fill="#57606A">accept, run id, holds stream</text>
  <line x1="400" y1="100" x2="440" y2="100" stroke="#57606A" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <rect x="440" y="72" width="196" height="56" rx="8" fill="#F6F8FA" stroke="#0969DA" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="454" y="94" font-size="15" font-weight="600" fill="#1F2328">Run queue</text>
  <text x="454" y="113" font-size="12.5" font-weight="400" fill="#57606A">lease, ack after persist, DLQ</text>
  <line x1="636" y1="100" x2="676" y2="100" stroke="#57606A" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <rect x="676" y="72" width="260" height="56" rx="8" fill="#F6F8FA" stroke="#0969DA" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="690" y="94" font-size="15" font-weight="600" fill="#1F2328">Workers</text>
  <text x="690" y="113" font-size="12.5" font-weight="400" fill="#57606A">N loops, pull with a lease</text>

  <!-- Workers down: Tools (detour), Run store (straight), Governor (straight) -->
  <path d="M704 128 V152 H398 V184" fill="none" stroke="#57606A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="724" y1="128" x2="724" y2="296" stroke="#57606A" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="716" y="272" text-anchor="end" font-size="12.5" font-weight="400" fill="#57606A">append step rows</text>
  <line x1="838" y1="128" x2="838" y2="184" stroke="#57606A" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- API node down to the Run store -->
  <line x1="292" y1="128" x2="292" y2="296" stroke="#57606A" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="300" y="272" font-size="12.5" font-weight="400" fill="#57606A">write run row, replay</text>

  <!-- row 2: y 184..240 -->
  <rect x="310" y="184" width="176" height="56" rx="8" fill="#F6F8FA" stroke="#8C959F" stroke-width="1"/>
  <text x="324" y="206" font-size="15" font-weight="600" fill="#1F2328">Tools</text>
  <text x="324" y="225" font-size="12.5" font-weight="400" fill="#57606A">ToolCaller, clock, allowlist</text>
  <line x1="486" y1="212" x2="516" y2="212" stroke="#57606A" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <rect x="516" y="184" width="130" height="56" rx="8" fill="#F6F8FA" stroke="#8C959F" stroke-width="1"/>
  <text x="530" y="206" font-size="15" font-weight="600" fill="#1F2328">Downstreams</text>
  <text x="530" y="225" font-size="12.5" font-weight="400" fill="#57606A">×N per question</text>

  <rect x="740" y="184" width="196" height="56" rx="8" fill="#F6F8FA" stroke="#0969DA" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="754" y="206" font-size="15" font-weight="600" fill="#1F2328">Governor</text>
  <text x="754" y="225" font-size="12.5" font-weight="400" fill="#57606A">share, burst, batch headroom</text>
  <line x1="866" y1="240" x2="866" y2="296" stroke="#57606A" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- row 3: y 296..352 -->
  <rect x="24" y="296" width="728" height="56" rx="8" fill="#F6F8FA" stroke="#8C959F" stroke-width="1"/>
  <text x="38" y="318" font-size="15" font-weight="600" fill="#1F2328">Run store</text>
  <text x="38" y="337" font-size="12.5" font-weight="400" fill="#57606A">one row per step, the ledger</text>

  <rect x="796" y="296" width="140" height="56" rx="8" fill="#FFF1E5" stroke="#BC4C00" stroke-width="1.5"/>
  <text x="810" y="318" font-size="15" font-weight="600" fill="#1F2328">Model</text>
  <text x="810" y="337" font-size="12.5" font-weight="400" fill="#57606A">shared, rate limited</text>

  <!-- legend -->
  <rect x="24" y="384" width="14" height="10" rx="2" fill="#FFF1E5" stroke="#BC4C00" stroke-width="1.5"/>
  <text x="44" y="393" font-size="12.5" font-weight="400" fill="#57606A">orange = the shared model step</text>
  <rect x="238" y="384" width="14" height="10" rx="2" fill="none" stroke="#0969DA" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="258" y="393" font-size="12.5" font-weight="400" fill="#57606A">blue dashed = designed, not built</text>
</svg>
