<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#57606A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="960" height="360" fill="#FFFFFF"/>

  <!-- staircase outline: treads under each level, risers in the gaps -->
  <path d="M 24 306 H 248 V 242 H 480 V 178 H 712 V 114 H 936" fill="none" stroke="#8C959F" stroke-width="1" stroke-linejoin="round"/>

  <!-- Level 0: in the loop thread (v1, neutral) -->
  <rect x="24" y="216" width="216" height="56" rx="8" fill="#F6F8FA" stroke="#8C959F" stroke-width="1"/>
  <text x="38" y="238" font-size="15" font-weight="600" fill="#1F2328">Level 0 · loop thread</text>
  <text x="38" y="257" font-size="12.5" font-weight="400" fill="#57606A">v1: a hang hangs the loop</text>
  <text x="38" y="292" font-size="12.5" font-weight="400" fill="#57606A">stops: nothing</text>

  <!-- Level 1: own thread + clock + allowlist (v2, built: green) -->
  <rect x="256" y="152" width="216" height="56" rx="8" fill="#F6F8FA" stroke="#1A7F37" stroke-width="1.5"/>
  <path d="M446 166 l4 4 l8 -9" fill="none" stroke="#1A7F37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="270" y="174" font-size="15" font-weight="600" fill="#1F2328">Level 1 · thread + clock</text>
  <text x="270" y="193" font-size="12.5" font-weight="400" fill="#57606A">v2: TIMEOUT, ERROR, DENIED</text>
  <text x="270" y="228" font-size="12.5" font-weight="400" fill="#57606A">stops: hang, crash</text>

  <!-- Level 2: separate process (designed: blue dashed) -->
  <rect x="488" y="88" width="216" height="56" rx="8" fill="#F6F8FA" stroke="#0969DA" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="502" y="110" font-size="15" font-weight="600" fill="#1F2328">Level 2 · process</text>
  <text x="502" y="129" font-size="12.5" font-weight="400" fill="#57606A">real kill, scrubbed env</text>
  <text x="502" y="164" font-size="12.5" font-weight="400" fill="#57606A">stops: + memory, credentials</text>

  <!-- Level 3: container, one door out (designed: blue dashed) -->
  <rect x="720" y="24" width="216" height="56" rx="8" fill="#F6F8FA" stroke="#0969DA" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="734" y="46" font-size="15" font-weight="600" fill="#1F2328">Level 3 · container</text>
  <text x="734" y="65" font-size="12.5" font-weight="400" fill="#57606A">own filesystem, one door out</text>
  <text x="734" y="100" font-size="12.5" font-weight="400" fill="#57606A">stops: + filesystem, network</text>

  <!-- legend -->
  <rect x="24" y="323" width="14" height="10" rx="2" fill="#F6F8FA" stroke="#1A7F37" stroke-width="1.5"/>
  <text x="44" y="332" font-size="12.5" font-weight="400" fill="#57606A">green = built in v2</text>
  <rect x="180" y="323" width="14" height="10" rx="2" fill="none" stroke="#0969DA" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="200" y="332" font-size="12.5" font-weight="400" fill="#57606A">blue dashed = designed, not built</text>
</svg>
