<svg xmlns="http://www.w3.org/2000/svg" width="960" height="452" viewBox="0 0 960 452" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#57606A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>

  <!-- white card -->
  <rect x="0" y="0" width="960" height="452" fill="#FFFFFF"/>

  <!-- crash labels above the timeline -->
  <text x="322" y="36" font-size="12.5" font-weight="600" fill="#1F2328" text-anchor="middle">crash</text>
  <text x="322" y="52" font-size="12.5" fill="#57606A" text-anchor="middle">before persist</text>
  <line x1="322" y1="58" x2="322" y2="93" stroke="#57606A" stroke-width="1.5"/>

  <text x="498" y="36" font-size="12.5" font-weight="600" fill="#1F2328" text-anchor="middle">crash</text>
  <text x="498" y="52" font-size="12.5" fill="#57606A" text-anchor="middle">after persist</text>
  <line x1="498" y1="58" x2="498" y2="93" stroke="#57606A" stroke-width="1.5"/>

  <!-- timeline boxes -->
  <rect x="24" y="76" width="120" height="56" rx="8" fill="#F6F8FA" stroke="#8C959F" stroke-width="1"/>
  <text x="38" y="98" font-size="15" font-weight="600" fill="#1F2328">1 · LLM row</text>
  <text x="38" y="117" font-size="12.5" fill="#57606A">persist</text>

  <rect x="174" y="76" width="120" height="56" rx="8" fill="#F6F8FA" stroke="#8C959F" stroke-width="1"/>
  <text x="188" y="98" font-size="15" font-weight="600" fill="#1F2328">Tool runs</text>
  <text x="188" y="117" font-size="12.5" fill="#57606A">side effect</text>

  <rect x="350" y="76" width="120" height="56" rx="8" fill="#F6F8FA" stroke="#8C959F" stroke-width="1"/>
  <text x="364" y="98" font-size="15" font-weight="600" fill="#1F2328">2 · TOOL row</text>
  <text x="364" y="117" font-size="12.5" fill="#57606A">persist</text>

  <rect x="526" y="76" width="120" height="56" rx="8" fill="#F6F8FA" stroke="#8C959F" stroke-width="1"/>
  <text x="540" y="98" font-size="15" font-weight="600" fill="#1F2328">3 · LLM row</text>
  <text x="540" y="117" font-size="12.5" fill="#57606A">persist</text>

  <rect x="676" y="76" width="96" height="56" rx="8" fill="#F6F8FA" stroke="#8C959F" stroke-width="1"/>
  <text x="690" y="98" font-size="15" font-weight="600" fill="#1F2328">Done</text>
  <text x="690" y="117" font-size="12.5" fill="#57606A">no tool call</text>

  <rect x="802" y="76" width="134" height="56" rx="8" fill="#F6F8FA" stroke="#8C959F" stroke-width="1"/>
  <text x="816" y="98" font-size="15" font-weight="600" fill="#1F2328">Answer</text>
  <text x="816" y="117" font-size="12.5" fill="#57606A">relayed to the user</text>

  <!-- timeline arrows -->
  <line x1="144" y1="104" x2="174" y2="104" stroke="#57606A" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <line x1="294" y1="104" x2="311" y2="104" stroke="#57606A" stroke-width="1.5" fill="none"/>
  <line x1="333" y1="104" x2="350" y2="104" stroke="#57606A" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <line x1="470" y1="104" x2="487" y2="104" stroke="#57606A" stroke-width="1.5" fill="none"/>
  <line x1="509" y1="104" x2="526" y2="104" stroke="#57606A" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <line x1="646" y1="104" x2="676" y2="104" stroke="#57606A" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <line x1="772" y1="104" x2="802" y2="104" stroke="#57606A" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- crash markers on the timeline -->
  <circle cx="322" cy="104" r="11" fill="#57606A"/>
  <text x="322" y="108.5" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">B</text>
  <circle cx="498" cy="104" r="11" fill="#57606A"/>
  <text x="498" y="108.5" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">A</text>

  <!-- persist arrows down to the store -->
  <line x1="84" y1="132" x2="84" y2="170" stroke="#57606A" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="92" y="155" font-size="12.5" fill="#57606A">row 1</text>
  <line x1="410" y1="132" x2="410" y2="170" stroke="#57606A" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="418" y="155" font-size="12.5" fill="#57606A">row 2</text>
  <line x1="586" y1="132" x2="586" y2="170" stroke="#57606A" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="594" y="155" font-size="12.5" fill="#57606A">row 3</text>

  <!-- run store -->
  <rect x="24" y="172" width="622" height="56" rx="8" fill="#F6F8FA" stroke="#8C959F" stroke-width="1"/>
  <text x="38" y="194" font-size="15" font-weight="600" fill="#1F2328">Run store</text>
  <text x="38" y="213" font-size="12.5" fill="#57606A">runs/&lt;id&gt;.jsonl · append only</text>

  <!-- window B note -->
  <circle cx="35" cy="262" r="11" fill="#57606A"/>
  <text x="35" y="266.5" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">B</text>
  <text x="54" y="267" font-size="15" font-weight="600" fill="#1F2328">Window B · crash before persist</text>
  <text x="24" y="289" font-size="12.5" fill="#57606A">the tool ran, but its row was not written yet</text>
  <text x="24" y="307" font-size="12.5" fill="#57606A">resume: pending call re-executed, handler ran twice</text>
  <text x="24" y="325" font-size="12.5" fill="#57606A">key &lt;runId&gt;/2 lets the tool dedupe the repeat</text>

  <!-- window A note -->
  <circle cx="511" cy="262" r="11" fill="#57606A"/>
  <text x="511" y="266.5" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">A</text>
  <text x="530" y="267" font-size="15" font-weight="600" fill="#1F2328">Window A · crash after persist</text>
  <text x="500" y="289" font-size="12.5" fill="#57606A">the TOOL row was written, step 3 not started</text>
  <text x="500" y="307" font-size="12.5" fill="#57606A">resume: rows 1–2 restored, model not re-asked</text>
  <text x="500" y="325" font-size="12.5" fill="#57606A">handler ran once</text>

  <!-- contract -->
  <text x="24" y="357" font-size="12.5" fill="#57606A">persisted steps run once</text>
  <text x="24" y="375" font-size="12.5" fill="#57606A">the in-flight call runs at least once</text>
  <text x="24" y="393" font-size="12.5" fill="#57606A">the model decision is recorded, never re-asked</text>

  <!-- legend -->
  <circle cx="31" cy="421" r="5" fill="#57606A"/>
  <text x="44" y="425" font-size="12.5" fill="#57606A">grey circle = crash window</text>
</svg>
