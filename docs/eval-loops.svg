<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#57606A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="430" fill="#FFFFFF"/>

  <!-- Rows are centred on y = 85, 187 and 289 -->

  <!-- Centre column: the orchestrator and its step rows -->
  <rect x="360" y="57" width="240" height="56" rx="8" fill="#F6F8FA" stroke="#8C959F" stroke-width="1"/>
  <text x="374" y="79" font-size="15" font-weight="600" fill="#1F2328">Orchestrator</text>
  <text x="374" y="98" font-size="12.5" font-weight="400" fill="#57606A">writes one row per step</text>

  <rect x="360" y="159" width="240" height="56" rx="8" fill="#F6F8FA" stroke="#8C959F" stroke-width="1"/>
  <text x="374" y="181" font-size="15" font-weight="600" fill="#1F2328">Step rows</text>
  <text x="374" y="200" font-size="12.5" font-weight="400" fill="#57606A">jsonl now, Run store at scale</text>

  <!-- Left loop: built in v2 (green stroke + check) -->
  <rect x="56" y="57" width="240" height="56" rx="8" fill="#F6F8FA" stroke="#1A7F37" stroke-width="1.5"/>
  <path d="M270 71 l4 4 l8 -9" fill="none" stroke="#1A7F37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="70" y="79" font-size="15" font-weight="600" fill="#1F2328">Golden set</text>
  <text x="70" y="98" font-size="12.5" font-weight="400" fill="#57606A">question, agent, expected</text>

  <rect x="56" y="159" width="240" height="56" rx="8" fill="#F6F8FA" stroke="#1A7F37" stroke-width="1.5"/>
  <path d="M270 173 l4 4 l8 -9" fill="none" stroke="#1A7F37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="70" y="181" font-size="15" font-weight="600" fill="#1F2328">Eval runner</text>
  <text x="70" y="200" font-size="12.5" font-weight="400" fill="#57606A">fresh loop per case</text>

  <rect x="56" y="261" width="240" height="56" rx="8" fill="#F6F8FA" stroke="#1A7F37" stroke-width="1.5"/>
  <path d="M270 275 l4 4 l8 -9" fill="none" stroke="#1A7F37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="70" y="283" font-size="15" font-weight="600" fill="#1F2328">Table</text>
  <text x="70" y="302" font-size="12.5" font-weight="400" fill="#57606A">right tool · stop · errors · ms</text>

  <!-- Right loop: designed, not built (blue dashed stroke) -->
  <rect x="664" y="57" width="240" height="56" rx="8" fill="#F6F8FA" stroke="#0969DA" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="678" y="79" font-size="15" font-weight="600" fill="#1F2328">Sample</text>
  <text x="678" y="98" font-size="12.5" font-weight="400" fill="#57606A">a slice of live step rows</text>

  <rect x="664" y="159" width="240" height="56" rx="8" fill="#F6F8FA" stroke="#0969DA" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="678" y="181" font-size="15" font-weight="600" fill="#1F2328">Judge</text>
  <text x="678" y="200" font-size="12.5" font-weight="400" fill="#57606A">another model, yes/no questions</text>

  <rect x="664" y="261" width="240" height="56" rx="8" fill="#F6F8FA" stroke="#0969DA" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="678" y="283" font-size="15" font-weight="600" fill="#1F2328">Rates</text>
  <text x="678" y="302" font-size="12.5" font-weight="400" fill="#57606A">per agent version</text>

  <!-- Arrows -->
  <g stroke="#57606A" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <!-- centre -->
    <path d="M480,113 V159"/>
    <!-- left loop -->
    <path d="M176,113 V159"/>
    <path d="M176,215 V261"/>
    <path d="M176,317 V349 H36 V85 H56"/>
    <!-- the eval runner drives the orchestrator -->
    <path d="M296,187 H328 V85 H360"/>
    <!-- right loop -->
    <path d="M784,113 V159"/>
    <path d="M784,215 V261"/>
    <path d="M784,317 V349 H924 V85 H904"/>
    <!-- step rows feed the sample -->
    <path d="M600,187 H632 V85 H664"/>
  </g>

  <!-- Return arrow labels -->
  <text x="106" y="368" font-size="12.5" font-weight="400" fill="#57606A" text-anchor="middle">before every change</text>
  <text x="854" y="368" font-size="12.5" font-weight="400" fill="#57606A" text-anchor="middle">vs last version</text>

  <!-- Legend -->
  <rect x="24" y="394" width="14" height="10" rx="2" fill="#F6F8FA" stroke="#1A7F37" stroke-width="1.5"/>
  <text x="44" y="403" font-size="12.5" font-weight="400" fill="#57606A">green = built in v2</text>
  <rect x="154" y="394" width="14" height="10" rx="2" fill="none" stroke="#0969DA" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="174" y="403" font-size="12.5" font-weight="400" fill="#57606A">blue dashed = designed, not built</text>
</svg>
