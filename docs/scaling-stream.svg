<svg viewBox="0 0 1120 400" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:1120px;font-family:-apple-system,Segoe UI,Roboto,sans-serif;font-size:12px">
<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a1f2b"/></marker><marker id="ahb" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0f6cbd"/></marker></defs>
<style>.b{fill:#fff;stroke:#1a1f2b;stroke-width:1.4;rx:8}.s{fill:#f1f0ec;stroke:#1a1f2b;stroke-width:1.2;rx:8}.o{fill:#eef1f5;stroke:#0f6cbd;stroke-width:1.6;rx:8}.mt{fill:#fbe6d2;stroke:#a85713;stroke-width:1.6;rx:8}.wx{fill:#f8e3e4;stroke:#b0222b;stroke-width:1.6;rx:8}.h{fill:#1a1f2b;font-weight:600}.m{fill:#5b6472;font-size:10px}.y{fill:#6b7280;font-size:9.5px;font-weight:700;letter-spacing:.08em}.wm{fill:#a85713;font-size:10px;font-weight:700}.rx{fill:#b0222b;font-size:10px;font-weight:600}.l{stroke:#1a1f2b;stroke-width:1.3;marker-end:url(#ah)}.p{fill:none;stroke:#1a1f2b;stroke-width:1.3;marker-end:url(#ah)}.d{stroke:#0f6cbd;stroke-width:1.3;stroke-dasharray:5 4;marker-end:url(#ahb);fill:none}</style>
<rect width="1120" height="400" fill="#fff"/>
<text class="y" x="15" y="14">SCALING THE STREAM — THE CONNECTION IS ON ONE POD, THE TURN RUNS ON ANOTHER</text>
<rect class="b" x="15" y="50" width="140" height="60"/><text class="h" x="85" y="72" text-anchor="middle">End users</text><text class="m" x="85" y="88" text-anchor="middle">thousands of open streams</text><text class="m" x="85" y="102" text-anchor="middle">reconnect with the last id</text>
<rect class="s" x="185" y="50" width="120" height="60"/><text class="h" x="245" y="72" text-anchor="middle">Load balancer</text><text class="m" x="245" y="88" text-anchor="middle">any node, any request</text><text class="m" x="245" y="102" text-anchor="middle">no stickiness needed</text>
<rect class="o" x="335" y="40" width="190" height="80"/><rect class="o" x="345" y="50" width="190" height="80"/><text class="h" x="440" y="72" text-anchor="middle">API nodes — N, stateless</text><text class="m" x="440" y="88" text-anchor="middle">hold the open streams</text><text class="m" x="440" y="102" text-anchor="middle">read the stream from the last id</text><text class="m" x="440" y="116" text-anchor="middle">any pod can serve any client</text>
<rect class="s" x="565" y="50" width="150" height="60"/><text class="h" x="640" y="72" text-anchor="middle">Run queue</text><text class="m" x="640" y="88" text-anchor="middle">lease · ack after the last step</text><text class="m" x="640" y="102" text-anchor="middle">depth drives the pods</text>
<rect class="s" x="745" y="40" width="190" height="80"/><rect class="s" x="755" y="50" width="190" height="80"/><text class="h" x="850" y="72" text-anchor="middle">Workers — N CPU pods</text><text class="m" x="850" y="88" text-anchor="middle">run the loop · write each step</text><text class="m" x="850" y="102" text-anchor="middle">append each step to the stream</text><text class="m" x="850" y="116" text-anchor="middle">autoscale on queue depth</text>
<rect class="o" x="400" y="190" width="345" height="70"/><text class="h" x="572" y="212" text-anchor="middle">Redis Stream — one per job id</text><text class="m" x="572" y="228" text-anchor="middle">the orchestrator appends each step with an id · a TTL after done</text><text class="m" x="572" y="242" text-anchor="middle">the pod holding the connection reads from the client's last id</text>
<path class="s" d="M745,300 a115,9 0 0 1 230,0 v44 a115,9 0 0 1 -230,0 z"/><path d="M745,300 a115,9 0 0 0 230,0" fill="none" stroke="#1a1f2b" stroke-width="1.2"/><text class="h" x="860" y="322" text-anchor="middle">Run store</text><text class="m" x="860" y="338" text-anchor="middle">turn → spans · the record, and the fallback</text>
<line class="l" x1="155" y1="80" x2="183" y2="80"/><line class="l" x1="305" y1="80" x2="333" y2="80"/><line class="l" x1="535" y1="80" x2="563" y2="80"/><line class="l" x1="715" y1="80" x2="743" y2="80"/>
<path class="d" d="M850,130 L850,225 L747,225"/><text class="m" x="858" y="180">1 · append each step</text>
<path class="d" d="M460,190 L460,132"/><text class="m" x="468" y="165">2 · the node forwards it as SSE</text>
<line class="l" x1="900" y1="130" x2="900" y2="293"/><text class="m" x="906" y="215">each step, before the next</text>
<path class="p" d="M360,130 L360,322 L743,322"/><text class="m" x="368" y="310">3 · if the stream fails: the answer is in the store anyway, a worse experience</text>
<text class="m" x="15" y="372">A client reconnects on any pod with the last id it saw and the pod reads the stream from there · a dropped connection is not a cancel; the orchestrator never knows.</text>
<text class="m" x="15" y="388">Grey = unchanged from durability · blue = this section: the stateless API pods and the stream between the orchestrator and the pod that holds the connection.</text>
</svg>
