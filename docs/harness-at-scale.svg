<svg viewBox="0 0 1120 520" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:1120px;font-family:-apple-system,Segoe UI,Roboto,sans-serif;font-size:12px">
<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a1f2b"/></marker></defs>
<style>.b{fill:#fff;stroke:#1a1f2b;stroke-width:1.4;rx:8}.s{fill:#f1f0ec;stroke:#1a1f2b;stroke-width:1.2;rx:8}.o{fill:#eef1f5;stroke:#0f6cbd;stroke-width:1.6;rx:8}.mt{fill:#fdf1e3;stroke:#c2410c;stroke-width:1.6;rx:8}.h{fill:#1a1f2b;font-weight:600}.m{fill:#5b6472;font-size:10.5px}.y{fill:#6b7280;font-size:9.5px;font-weight:700;letter-spacing:.08em}.bx{fill:#0f6cbd;font-size:10px;font-weight:600}.l{stroke:#1a1f2b;stroke-width:1.3;marker-end:url(#ah)}.ld{stroke:#1a1f2b;stroke-width:1.3;marker-end:url(#ah);stroke-dasharray:4 3}.cyl{fill:#fff;stroke:#1a1f2b;stroke-width:1.2}.cyls{fill:#f1f0ec;stroke:#1a1f2b;stroke-width:1.2}</style>
<rect width="1120" height="520" fill="#fff"/>
<text class="y" x="15" y="14">THE HARNESS AT SCALE · EVERY PAGE'S PIECE ON THE V2 SPINE</text>

<!-- user -->
<text class="h" x="45" y="118" text-anchor="middle">user</text>
<circle cx="45" cy="92" r="11" fill="none" stroke="#1a1f2b" stroke-width="1.4"/>
<line class="l" x1="70" y1="100" x2="108" y2="100"/>

<!-- API pods -->
<rect class="o" x="110" y="40" width="210" height="120"/>
<text class="h" x="215" y="62" text-anchor="middle">API pods</text>
<text class="m" x="215" y="82" text-anchor="middle">POST /runs → 202 with the job id</text>
<text class="m" x="215" y="96" text-anchor="middle">GET /turns/{id}/events → SSE</text>
<text class="m" x="215" y="116" text-anchor="middle">reads the run's stream from the</text>
<text class="m" x="215" y="130" text-anchor="middle">client's last id; the store only when</text>
<text class="m" x="215" y="144" text-anchor="middle">the stream is gone</text>

<!-- run stream -->
<g transform="translate(110,190)"><path class="cyls" d="M0,10 a105,8 0 0,0 210,0 v90 a105,8 0 0,1 -210,0 z"/><ellipse class="cyls" cx="105" cy="10" rx="105" ry="8"/>
<text class="h" x="105" y="38" text-anchor="middle">run stream, per job id</text><text class="m" x="105" y="56" text-anchor="middle">every step, every token, done</text><text class="m" x="105" y="70" text-anchor="middle">a Redis Stream, replay from an id</text><text class="bx" x="105" y="90" text-anchor="middle">v2: a map in the API process</text></g>
<line class="l" x1="215" y1="160" x2="215" y2="188"/>

<!-- queue -->
<g transform="translate(350,55)"><path class="cyls" d="M0,10 a85,8 0 0,0 170,0 v80 a85,8 0 0,1 -170,0 z"/><ellipse class="cyls" cx="85" cy="10" rx="85" ry="8"/>
<text class="h" x="85" y="38" text-anchor="middle">queue</text><text class="m" x="85" y="56" text-anchor="middle">one message per turn</text><text class="m" x="85" y="70" text-anchor="middle">visibility timeout = the lease</text><text class="bx" x="85" y="88" text-anchor="middle">v2: a table, the same three calls</text></g>
<line class="l" x1="320" y1="100" x2="348" y2="100"/>
<line class="l" x1="520" y1="100" x2="558" y2="100"/>

<!-- worker pods -->
<rect class="o" x="560" y="40" width="300" height="200"/>
<text class="h" x="710" y="62" text-anchor="middle">worker pods: the loop</text>
<text class="m" x="710" y="82" text-anchor="middle">context → LLM proxy → tool caller → rows</text>
<text class="m" x="710" y="96" text-anchor="middle">every row saved before the next step</text>
<text class="m" x="710" y="110" text-anchor="middle">lease extended on each row, acked last</text>
<text class="m" x="710" y="130" text-anchor="middle">parallel calls · chained passes · dedupe</text>
<text class="m" x="710" y="144" text-anchor="middle">a clock and the agent's list on every call</text>
<text class="m" x="710" y="164" text-anchor="middle">agent as a tool: a child loop inside the call,</text>
<text class="m" x="710" y="178" text-anchor="middle">the parent gets only the answer</text>
<text class="m" x="710" y="198" text-anchor="middle">a dead worker's turn comes back on the queue;</text>
<text class="m" x="710" y="212" text-anchor="middle">the next one resumes from the saved rows</text>
<text class="bx" x="710" y="230" text-anchor="middle">v2: one process, the stream pushed to the API over HTTP</text>
<path class="l" d="M560,225 H440 V300 H322" fill="none"/>
<text class="m" x="381" y="292" text-anchor="middle">pushes every event</text>

<!-- state store -->
<g transform="translate(540,270)"><path class="cyl" d="M0,10 a70,8 0 0,0 140,0 v70 a70,8 0 0,1 -140,0 z"/><ellipse class="cyl" cx="70" cy="10" rx="70" ry="8"/>
<text class="h" x="70" y="38" text-anchor="middle">state store</text><text class="m" x="70" y="56" text-anchor="middle">conversation · turn · span</text><text class="bx" x="70" y="76" text-anchor="middle">v2: one SQLite file</text></g>
<line class="l" x1="610" y1="240" x2="610" y2="268"/>

<!-- telemetry + eval -->
<g transform="translate(715,270)"><path class="cyls" d="M0,10 a80,8 0 0,0 160,0 v70 a80,8 0 0,1 -160,0 z"/><ellipse class="cyls" cx="80" cy="10" rx="80" ry="8"/>
<text class="h" x="80" y="38" text-anchor="middle">span rows, column-shaped</text><text class="m" x="80" y="56" text-anchor="middle">a trace id on every row</text><text class="m" x="80" y="70" text-anchor="middle">rates per agent version</text></g>
<line class="ld" x1="680" y1="320" x2="713" y2="320"/>
<rect class="s" x="715" y="372" width="160" height="58"/><text class="h" x="795" y="390" text-anchor="middle">evals</text><text class="m" x="795" y="406" text-anchor="middle">golden set before ship (v2)</text><text class="m" x="795" y="420" text-anchor="middle">a sampled judge, live</text>
<line class="l" x1="795" y1="358" x2="795" y2="370"/>

<!-- model side -->
<rect class="mt" x="890" y="40" width="215" height="120"/>
<text class="h" x="997" y="62" text-anchor="middle">gateway + governor</text>
<text class="m" x="997" y="82" text-anchor="middle">one service in front of the shared GPU</text>
<text class="m" x="997" y="96" text-anchor="middle">meter from calls and tokens · fair share</text>
<text class="m" x="997" y="110" text-anchor="middle">batch admitted into the room</text>
<text class="m" x="997" y="124" text-anchor="middle">routing among the agent's declared models,</text>
<text class="m" x="997" y="138" text-anchor="middle">nearest region under the threshold</text>
<text class="bx" x="997" y="154" text-anchor="middle">v2: a rule stub behind the LLM proxy</text>
<line class="l" x1="860" y1="100" x2="888" y2="100"/>

<!-- tool side -->
<rect class="s" x="890" y="180" width="215" height="60"/>
<text class="h" x="997" y="200" text-anchor="middle">tool gateway, as the user</text>
<text class="m" x="997" y="216" text-anchor="middle">REST and MCP calls with the user's token</text>
<text class="m" x="997" y="230" text-anchor="middle">catalog + index behind one search tool</text>
<line class="l" x1="860" y1="210" x2="888" y2="210"/>

<rect class="o" x="890" y="255" width="215" height="74"/>
<text class="h" x="997" y="275" text-anchor="middle">sandbox</text>
<text class="m" x="997" y="291" text-anchor="middle">a tool that runs code: a container per call</text>
<text class="bx" x="997" y="307" text-anchor="middle">v2: Docker on the worker</text>
<text class="m" x="997" y="321" text-anchor="middle">design: a runner service owns the boxes</text>
<path class="l" d="M860,225 H875 V292 H888" fill="none"/>

<!-- legend -->
<rect class="b" x="110" y="444" width="995" height="60"/>
<text class="h" x="125" y="464">What each colour means</text>
<text class="m" x="125" y="482">blue = built in v2, with the stand-in named where one stands in for the production piece · beige = design, from my platform · orange = the one multi-tenant service in front of shared GPUs</text>
<text class="m" x="125" y="496">The pages: durability (queue, lease, dead worker) · scaling (stream, governor) · performance (cache, tools, dedupe, leakage) · sub-agents · measuring · routing · sandboxing.</text>
</svg>
