<svg viewBox="0 0 1120 400" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:1120px;font-family:-apple-system,Segoe UI,Roboto,sans-serif;font-size:12px">
<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a1f2b"/></marker><marker id="ahb" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0f6cbd"/></marker></defs>
<style>.b{fill:#fff;stroke:#1a1f2b;stroke-width:1.4;rx:8}.s{fill:#f1f0ec;stroke:#1a1f2b;stroke-width:1.2;rx:8}.o{fill:#eef1f5;stroke:#0f6cbd;stroke-width:1.6;rx:8}.mt{fill:#fbe6d2;stroke:#a85713;stroke-width:1.6;rx:8}.h{fill:#1a1f2b;font-weight:600}.m{fill:#5b6472;font-size:10px}.y{fill:#6b7280;font-size:9.5px;font-weight:700;letter-spacing:.08em}.wm{fill:#a85713;font-size:10px;font-weight:700}.l{stroke:#1a1f2b;stroke-width:1.3;marker-end:url(#ah)}.p{fill:none;stroke:#1a1f2b;stroke-width:1.3;marker-end:url(#ah)}.d{stroke:#0f6cbd;stroke-width:1.3;stroke-dasharray:5 4;marker-end:url(#ahb);fill:none}</style>
<rect width="1120" height="400" fill="#fff"/>
<text class="y" x="15" y="14">V2 HLD — THE SAME LOOP AS V1, AS A SMALL SERVICE · A TURN IS A JOB · THE ANSWER STREAMS BACK</text>

<rect class="b" x="15" y="150" width="140" height="60"/><text class="h" x="85" y="172" text-anchor="middle">User</text><text class="m" x="85" y="188" text-anchor="middle">asks a question</text><text class="m" x="85" y="202" text-anchor="middle">job id back · then the stream</text>
<line class="l" x1="155" y1="172" x2="183" y2="172"/>

<rect class="o" x="185" y="40" width="545" height="225"/><text class="h" x="200" y="58">Orchestrator service</text><text class="m" x="345" y="58">one service, two layers: the HTTP face and the loop</text>
<rect class="b" x="197" y="66" width="150" height="130"/><text class="h" x="272" y="86" text-anchor="middle">API layer — HTTP</text><text class="m" x="272" y="103" text-anchor="middle">POST /runs → job id at once</text><text class="m" x="272" y="117" text-anchor="middle">GET /turns/{id} · steps, answer</text><text class="m" x="272" y="131" text-anchor="middle">GET /turns/{id}/events · SSE</text><text class="m" x="272" y="145" text-anchor="middle">agents and tools: metadata files</text><text class="m" x="272" y="166" text-anchor="middle">forwards the run's stream</text><text class="m" x="272" y="180" text-anchor="middle">to the client, by job id</text>
<line class="l" x1="347" y1="110" x2="360" y2="110"/>
<rect class="b" x="362" y="66" width="355" height="170"/><text class="h" x="539" y="86" text-anchor="middle">Orchestrator — the loop</text><text class="m" x="539" y="104" text-anchor="middle">build the context (the question + the rows so far)</text><text class="m" x="539" y="118" text-anchor="middle">ask the model → run what it names → write the row → ask again</text><text class="m" x="539" y="132" text-anchor="middle">until the model says done · then the answer, relayed and streamed</text><text class="m" x="539" y="152" text-anchor="middle">every row in the store before the next step is taken</text><text class="m" x="539" y="166" text-anchor="middle">several tools in one reply run together · a clock on every call</text><text class="m" x="539" y="180" text-anchor="middle">an agent can be a tool: a child loop inside the call</text><text class="m" x="539" y="194" text-anchor="middle">a repeated call is a reference · caps on passes, calls, depth</text>
<text class="m" x="539" y="222" text-anchor="middle">the loop's two seams are the boxes on the right</text>

<rect class="o" x="760" y="46" width="340" height="76"/><text class="h" x="930" y="66" text-anchor="middle">LLM proxy — the single entry point to the model</text><text class="m" x="930" y="83" text-anchor="middle">the context in · a tool call with its input, or done, out</text><text class="m" x="930" y="97" text-anchor="middle">in production this is the gateway: it picks the model,</text><text class="m" x="930" y="110" text-anchor="middle">routes by tenant and tier, and shares the GPU</text>
<rect class="s" x="760" y="134" width="165" height="54"/><text class="h" x="842" y="153" text-anchor="middle">Rule-based LLM · this POC</text><text class="m" x="842" y="169" text-anchor="middle">keywords on the question,</text><text class="m" x="842" y="181" text-anchor="middle">then the ids the results name</text>
<rect class="mt" x="935" y="134" width="165" height="54"/><text class="h" x="1017" y="153" text-anchor="middle">LLM on a GPU · production</text><text class="wm" x="1017" y="169" text-anchor="middle">shared by every customer</text><text class="m" x="1017" y="181" text-anchor="middle">the scaling page: the governor</text>
<line class="l" x1="842" y1="122" x2="842" y2="132"/><line class="l" x1="1017" y1="122" x2="1017" y2="132"/>
<line class="l" x1="717" y1="70" x2="758" y2="70"/><text class="m" x="738" y="64" text-anchor="middle">①</text>
<line class="l" x1="758" y1="96" x2="717" y2="96"/><text class="m" x="738" y="109" text-anchor="middle">②</text>

<rect class="s" x="760" y="200" width="340" height="62"/><text class="h" x="930" y="219" text-anchor="middle">Tool caller</text><text class="m" x="930" y="236" text-anchor="middle">runs what the model names, under the agent's tool list and clock</text><text class="m" x="930" y="250" text-anchor="middle">several tools in one reply run together</text>
<rect class="s" x="760" y="276" width="165" height="62"/><text class="h" x="842" y="295" text-anchor="middle">Tool registry</text><text class="m" x="842" y="312" text-anchor="middle">tools from tools/*.json</text><text class="m" x="842" y="326" text-anchor="middle">the type picks the adapter</text>
<rect class="s" x="935" y="276" width="165" height="62"/><text class="h" x="1017" y="294" text-anchor="middle">Tools</text><text class="m" x="1017" y="309" text-anchor="middle">lookup · sleep · fail · agent</text><text class="m" x="1017" y="321" text-anchor="middle">this POC: data in the tool file</text><text class="m" x="1017" y="333" text-anchor="middle">prod: a tool gateway, REST, MCP</text>
<line class="l" x1="842" y1="262" x2="842" y2="274"/><line class="l" x1="1017" y1="262" x2="1017" y2="274"/>
<line class="l" x1="717" y1="210" x2="758" y2="210"/><text class="m" x="738" y="204" text-anchor="middle">③</text>
<line class="l" x1="758" y1="232" x2="717" y2="232"/><text class="m" x="738" y="245" text-anchor="middle">④</text>

<path class="s" d="M400,310 a125,9 0 0 1 250,0 v44 a125,9 0 0 1 -250,0 z"/><path d="M400,310 a125,9 0 0 0 250,0" fill="none" stroke="#1a1f2b" stroke-width="1.2"/><text class="h" x="525" y="333" text-anchor="middle">Run store — SQLite</text><text class="m" x="525" y="347" text-anchor="middle">conversation → turn (job id) → span rows</text><text class="m" x="525" y="359" text-anchor="middle">the tenant database at scale</text>
<line class="l" x1="539" y1="265" x2="539" y2="301"/><text class="m" x="547" y="286">each step · before the next</text>
<path class="p" d="M272,265 L272,340 L392,340"/><text class="m" x="280" y="330">the turn row</text>

<path class="d" d="M450,236 L450,247 L310,247 L310,198"/><text class="m" x="320" y="261">the run's stream: each step, each answer token</text>
<path class="d" d="M230,265 L230,290 L85,290 L85,212"/><text class="m" x="95" y="282">SSE: steps and answer tokens</text>

<text class="m" x="15" y="372">① the context · ② a tool to call with its input, or done · ③ the call · ④ the result, written as a row, then ① again. v1 drew exactly this loop; v2 keeps it and puts the service, the store and the stream around it.</text>
<text class="m" x="15" y="388">Blue = the loop and its entry point to the model, this document's subject · orange = the production implementation behind that entry point, shared by every customer · dashed = the stream back to the client.</text>
</svg>
