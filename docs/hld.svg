<svg viewBox="0 0 1120 360" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:1120px;font-family:-apple-system,Segoe UI,Roboto,sans-serif;font-size:12px">
<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a1f2b"/></marker><marker id="ahb" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0f6cbd"/></marker></defs>
<style>.b{fill:#fff;stroke:#1a1f2b;stroke-width:1.4;rx:8}.s{fill:#f1f0ec;stroke:#1a1f2b;stroke-width:1.2;rx:8}.o{fill:#eef1f5;stroke:#0f6cbd;stroke-width:1.6;rx:8}.mt{fill:#fbe6d2;stroke:#a85713;stroke-width:1.6;rx:8}.h{fill:#1a1f2b;font-weight:600}.m{fill:#5b6472;font-size:10px}.y{fill:#6b7280;font-size:9.5px;font-weight:700;letter-spacing:.08em}.wm{fill:#a85713;font-size:10px;font-weight:700}.l{stroke:#1a1f2b;stroke-width:1.3;marker-end:url(#ah)}.p{fill:none;stroke:#1a1f2b;stroke-width:1.3;marker-end:url(#ah)}.d{stroke:#0f6cbd;stroke-width:1.3;stroke-dasharray:5 4;marker-end:url(#ahb);fill:none}</style>
<rect width="1120" height="360" fill="#fff"/>
<text class="y" x="15" y="14">V2 HLD — THE V1 LOOP AS A SMALL SERVICE · A TURN IS A JOB · THE ANSWER STREAMS BACK</text>

<rect class="b" x="15" y="110" width="130" height="56"/><text class="h" x="80" y="132" text-anchor="middle">User</text><text class="m" x="80" y="150" text-anchor="middle">asks a question</text>
<line class="l" x1="145" y1="130" x2="183" y2="130"/>

<rect class="o" x="185" y="50" width="520" height="170"/><text class="h" x="200" y="70">Orchestrator service</text>
<rect class="b" x="200" y="84" width="150" height="116"/><text class="h" x="275" y="106" text-anchor="middle">API layer</text><text class="m" x="275" y="126" text-anchor="middle">POST /runs → job id, at once</text><text class="m" x="275" y="142" text-anchor="middle">GET /turns/{id} → the turn</text><text class="m" x="275" y="158" text-anchor="middle">GET /turns/{id}/events → SSE</text><text class="m" x="275" y="182" text-anchor="middle">agents and tools are files</text>
<line class="l" x1="350" y1="130" x2="370" y2="130"/>
<rect class="b" x="372" y="84" width="318" height="116"/><text class="h" x="531" y="106" text-anchor="middle">Orchestrator — the loop</text><text class="m" x="531" y="130" text-anchor="middle">build the context from the rows so far</text><text class="m" x="531" y="146" text-anchor="middle">ask the model · run what it names · write the row</text><text class="m" x="531" y="162" text-anchor="middle">again, until the model says done</text><text class="m" x="531" y="186" text-anchor="middle">every row is in the store before the next step</text>

<rect class="o" x="770" y="50" width="330" height="56"/><text class="h" x="935" y="72" text-anchor="middle">LLM proxy — the entry point to the model</text><text class="m" x="935" y="92" text-anchor="middle">context in · a tool call with its input, or done, out</text>
<rect class="s" x="770" y="116" width="160" height="44"/><text class="h" x="850" y="134" text-anchor="middle">this POC: a rule stub</text><text class="m" x="850" y="150" text-anchor="middle">keywords, then ids in results</text>
<rect class="mt" x="940" y="116" width="160" height="44"/><text class="h" x="1020" y="134" text-anchor="middle">production: model on GPU</text><text class="m" x="1020" y="150" text-anchor="middle">behind a gateway, the governor</text>
<line class="l" x1="850" y1="106" x2="850" y2="114"/><line class="l" x1="1020" y1="106" x2="1020" y2="114"/>
<line class="l" x1="690" y1="112" x2="768" y2="80"/><text class="m" x="720" y="88" text-anchor="middle">①</text>
<line class="l" x1="768" y1="98" x2="690" y2="130"/><text class="m" x="740" y="122" text-anchor="middle">②</text>

<rect class="s" x="770" y="180" width="330" height="72"/><text class="h" x="935" y="200" text-anchor="middle">Tools — caller, registry, adapters</text><text class="m" x="935" y="217" text-anchor="middle">tools from files · the type picks the adapter · the agent's list and clock</text><text class="m" x="935" y="231" text-anchor="middle">this POC: lookups in the tool file</text><text class="m" x="935" y="245" text-anchor="middle">production: a tool gateway, REST and MCP calls as the user</text>
<line class="l" x1="690" y1="150" x2="768" y2="196"/><text class="m" x="712" y="162" text-anchor="middle">③</text>
<line class="l" x1="768" y1="228" x2="690" y2="172"/><text class="m" x="738" y="214" text-anchor="middle">④</text>

<path class="s" d="M420,270 a110,9 0 0 1 220,0 v36 a110,9 0 0 1 -220,0 z"/><path d="M420,270 a110,9 0 0 0 220,0" fill="none" stroke="#1a1f2b" stroke-width="1.2"/><text class="h" x="530" y="290" text-anchor="middle">Run store</text><text class="m" x="530" y="306" text-anchor="middle">conversation → turn (job id) → span rows</text>
<line class="l" x1="531" y1="220" x2="531" y2="262"/><text class="m" x="538" y="244">each row, before the next step</text>
<path class="p" d="M275,220 L275,290 L412,290"/><text class="m" x="282" y="282">the turn row</text>

<path class="d" d="M420,200 L420,212 L330,212 L330,202"/><text class="m" x="432" y="216">the run's stream: steps and answer tokens</text>
<path class="d" d="M230,220 L230,245 L80,245 L80,168"/><text class="m" x="90" y="238">SSE, by job id</text>

<text class="m" x="15" y="340">① the context · ② a tool to call, or done · ③ the call · ④ the result, written as a row, then ① again: the loop v1 drew. Orange = what sits behind the proxy in production, shared by every customer.</text>
</svg>
